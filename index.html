<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What the logs cannot tell you</title>
<meta name="description" id="metaDesc" content="Three measurements on public Criteo advertising data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,75..125,400..800;1,75..125,400&family=Gothic+A1:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#E4E7E4;
  --surface:#F1F3F0;
  --raised:#FAFBF9;
  --ink:#191D1B;
  --muted:#5E6763;
  --rule:#C2C8C3;
  --rule-soft:#D5DAD6;
  --ochre:#8A6A00;
  --ochre-l:#C9A83A;
  --ochre-wash:#EFE7CE;
  --indigo:#26357A;
  --indigo-l:#7C88C4;
  --indigo-wash:#DFE2EF;
  --disp:'Archivo',system-ui,sans-serif;
  --body:'Newsreader',Georgia,serif;
  --data:'Archivo',system-ui,sans-serif;
}
body.ko{
  --disp:'Gothic A1','Archivo',sans-serif;
  --body:'Noto Serif KR','Newsreader',serif;
  --data:'Archivo','Gothic A1',sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--body);font-size:18px;line-height:1.62;
  font-variant-numeric:tabular-nums;
  font-synthesis-weight:none}
body.ko{font-size:16.5px;line-height:1.85}
.wrap{max-width:1140px;margin:0 auto;padding:0 32px}
a{color:var(--indigo);text-underline-offset:3px}
a:hover{background:var(--indigo-wash)}
:focus-visible{outline:2.5px solid var(--ochre);outline-offset:3px}

/* ---------- type ---------- */
h1,h2,h3{font-family:var(--disp);font-variation-settings:'wdth' 112}
h1{font-size:clamp(36px,6.6vw,78px);font-weight:800;line-height:.96;
  letter-spacing:-.038em;margin:0 0 22px;max-width:15ch;text-wrap:balance}
body.ko h1{font-weight:700;letter-spacing:-.03em;line-height:1.16;max-width:13ch}
h2{font-size:clamp(25px,3.3vw,38px);font-weight:700;letter-spacing:-.028em;
  line-height:1.06;margin:0 0 10px;max-width:20ch}
body.ko h2{font-weight:700;letter-spacing:-.02em;line-height:1.3}
h3{font-size:clamp(17px,1.9vw,21px);font-weight:600;letter-spacing:-.015em;margin:0 0 8px}
p{margin:0 0 18px;max-width:60ch}
body.ko p{max-width:42ch}
.lede{font-size:clamp(19px,2.2vw,24px);line-height:1.48;max-width:40ch;
  font-family:var(--body)}
body.ko .lede{line-height:1.72;max-width:31ch}
.note{font-size:15px;color:var(--muted);line-height:1.58;max-width:52ch}
body.ko .note{max-width:38ch;line-height:1.78}

.tag,.eyebrow,.cap,.axis{font-family:var(--data);font-variation-settings:'wdth' 100}
.eyebrow{display:block;font-size:11px;font-weight:600;letter-spacing:.2em;
  text-transform:uppercase;color:var(--muted);margin:0 0 16px}
body.ko .eyebrow{letter-spacing:.08em;text-transform:none;font-size:12.5px}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;padding:5px 9px;background:var(--ink);color:var(--ground)}
body.ko .tag{letter-spacing:.04em;text-transform:none;font-size:12px}
.cap{font-size:12.5px;color:var(--muted);line-height:1.55}

/* ---------- masthead ---------- */
header{padding:36px 0 0}
.top{display:flex;justify-content:space-between;align-items:flex-start;
  gap:20px;flex-wrap:wrap;margin-bottom:64px}
.top .id{font-family:var(--data);font-size:11.5px;font-weight:600;
  letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
  line-height:1.9;max-width:22ch}
body.ko .top .id{letter-spacing:.05em;text-transform:none;font-size:12.5px}
.switches{display:flex;gap:10px;flex-wrap:wrap}
.sw{display:inline-flex;border:1.5px solid var(--ink);background:var(--raised)}
.sw button,.sw label{font-family:var(--data);font-size:13.5px;font-weight:600;
  padding:9px 15px;background:transparent;color:var(--ink);border:0;
  border-right:1.5px solid var(--ink);cursor:pointer;line-height:1.25;
  user-select:none;white-space:nowrap;transition:background .12s,color .12s}
.sw button:last-child,.sw label:last-child{border-right:0}
.sw button:hover,.sw label:hover{background:var(--ochre-wash)}
.sw button[aria-pressed=true],.sw label:has(input:checked){background:var(--ink);color:var(--ground)}
.sw input{position:absolute;opacity:0;width:0;height:0}

/* ---------- signature: reading panel ---------- */
.reading{margin:44px 0 0;background:var(--surface);border:1.5px solid var(--ink)}
.reading .strip{padding:20px 24px 0}
.striplabel{display:flex;justify-content:space-between;align-items:baseline;
  gap:14px;flex-wrap:wrap;font-family:var(--data);font-size:11.5px;
  font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
body.ko .striplabel{letter-spacing:.04em;text-transform:none;font-size:12.5px}
.striplabel b{font-size:16px;letter-spacing:0;color:var(--ink);font-weight:700}
.bar{position:relative;height:16px;background:var(--rule-soft);margin-top:10px;
  border:1px solid var(--rule)}
.bar span{position:absolute;left:0;top:0;bottom:0;background:var(--ink);
  transition:width .32s cubic-bezier(.4,0,.2,1),background-color .2s}
.reading .body{padding:22px 24px 26px}
.reading .ctl{margin:0 0 22px}
.readouts{display:grid;margin:22px 0 0;border-top:1.5px solid var(--ink);padding-top:20px}
.readouts>p{grid-area:1/1;margin:0;font-size:clamp(18px,2.1vw,22px);line-height:1.46;
  max-width:46ch;font-family:var(--body)}
body.ko .readouts>p{line-height:1.7;max-width:34ch}
.readouts>p[data-off]{visibility:hidden}
.readouts b{font-family:var(--data);font-weight:700;font-variation-settings:'wdth' 100}
.keys{display:flex;gap:24px;flex-wrap:wrap;margin:16px 0 0;
  font-family:var(--data);font-size:12px;color:var(--muted)}
.keys i{display:inline-block;width:18px;height:3px;vertical-align:3px;margin-right:8px}

/* ---------- sections ---------- */
section{padding:76px 0;border-top:1.5px solid var(--ink)}
.head{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;margin-bottom:30px}
.filters{font-family:var(--data);font-size:13px;font-weight:500;color:var(--ochre);
  letter-spacing:.01em}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;
  border-top:1.5px solid var(--ink)}
.track{padding:26px 30px 30px;border-right:1.5px solid var(--rule)}
.track:last-child{border-right:0}
.track.ochre{background:linear-gradient(var(--ochre-wash),var(--ochre-wash)) no-repeat top/100% 4px}
.track.indigo{background:linear-gradient(var(--indigo-wash),var(--indigo-wash)) no-repeat top/100% 4px}
.tracktitle{font-family:var(--data);font-size:12px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;margin:0 0 14px}
body.ko .tracktitle{letter-spacing:.04em;text-transform:none;font-size:13px}
.track.ochre .tracktitle{color:var(--ochre)}
.track.indigo .tracktitle{color:var(--indigo)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:52px;align-items:start}
.split.rev{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}

/* ---------- data blocks ---------- */
figure{margin:0;background:var(--surface);border:1px solid var(--rule);padding:20px 20px 14px}
figcaption{font-family:var(--data);font-size:12.5px;color:var(--muted);
  line-height:1.6;padding:12px 0 2px}
table{width:100%;border-collapse:collapse;font-family:var(--data);
  font-size:13.5px;font-variation-settings:'wdth' 100}
caption{text-align:left;font-size:11px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);padding-bottom:12px}
body.ko caption{letter-spacing:.03em;text-transform:none;font-size:12.5px}
th,td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--rule-soft)}
th:first-child,td:first-child{text-align:left}
thead th{font-weight:700;border-bottom:2px solid var(--ink);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.hi{color:var(--ochre);font-weight:700}
td.ok{color:var(--indigo);font-weight:700}

.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:1px;background:var(--rule);border:1px solid var(--rule);margin:30px 0 0}
.fig{background:var(--surface);padding:18px 17px}
.fig .n{display:block;font-family:var(--data);font-size:30px;font-weight:800;
  letter-spacing:-.03em;line-height:1.08;font-variation-settings:'wdth' 108}
.fig .l{display:block;font-family:var(--data);font-size:12px;font-weight:500;
  color:var(--muted);margin-top:9px;line-height:1.48}

/* ---------- controls ---------- */
.panel{background:var(--surface);border:1.5px solid var(--ink);padding:24px 22px}
.marker{display:inline-flex;align-items:center;gap:8px;font-family:var(--data);
  font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ochre);margin:0 0 18px}
body.ko .marker{letter-spacing:.04em;text-transform:none;font-size:12.5px}
.marker::before{content:'';width:9px;height:9px;background:var(--ochre)}
.f{margin-bottom:24px}
.f:last-of-type{margin-bottom:0}
.f>label{display:block;font-family:var(--data);font-size:13px;font-weight:600;
  color:var(--muted);margin-bottom:10px}
.f .v{float:right;font-family:var(--data);font-size:16px;font-weight:800;color:var(--ochre)}
select.in,input.in{font-family:var(--data);font-size:15px;font-weight:600;
  padding:11px 14px;border:1.5px solid var(--ink);background:var(--raised);
  color:var(--ink);cursor:pointer;min-width:140px;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),
                   linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:calc(100% - 18px) calc(50% + 1px),calc(100% - 13px) calc(50% + 1px);
  background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:36px}
select.in:hover,input.in:hover{background-color:var(--ochre-wash)}
input.in{cursor:text;background-image:none;padding-right:14px;min-width:0;width:140px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;
  background:transparent;cursor:pointer;margin:4px 0 0}
input[type=range]::-webkit-slider-runnable-track{height:10px;background:var(--rule-soft);border:1.5px solid var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:26px;height:26px;background:var(--ochre);border:2.5px solid var(--ink);margin-top:-10px}
input[type=range]::-moz-range-track{height:10px;background:var(--rule-soft);border:1.5px solid var(--ink)}
input[type=range]::-moz-range-thumb{width:23px;height:23px;background:var(--ochre);border:2.5px solid var(--ink)}
.act{font-family:var(--data);font-size:13.5px;font-weight:600;padding:10px 15px;
  border:1.5px solid var(--ink);background:var(--raised);color:var(--ink);
  cursor:pointer;margin-top:14px}
.act:hover{background:var(--ochre-wash)}
.res{border-top:2px solid var(--ink);margin-top:24px;padding-top:20px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:20px}
.res .rv{display:block;font-family:var(--data);font-size:30px;font-weight:800;
  letter-spacing:-.03em;line-height:1.08;color:var(--ochre);font-variation-settings:'wdth' 108}
.res .rl{display:block;font-family:var(--data);font-size:12px;font-weight:500;
  color:var(--muted);margin-top:8px;line-height:1.48}

/* ---------- misc ---------- */
.pair td{vertical-align:top;text-align:left;line-height:1.55;font-size:13.5px}
.pair th{text-align:left}
.pair th:nth-child(2){color:var(--ochre)}
.pair th:nth-child(3){color:var(--indigo)}
.pair td:first-child{color:var(--muted);width:22%;font-size:12px;font-weight:600}
ul{padding-left:22px;max-width:58ch}
body.ko ul{max-width:44ch}
li{margin-bottom:12px}
footer{padding:56px 0 90px;border-top:1.5px solid var(--ink);color:var(--muted);font-size:15px}
footer p{max-width:60ch}
#err{display:none;margin:40px 0;padding:24px;border:2px solid var(--ochre);
  background:var(--surface);font-size:16px}
#err code{font-family:var(--data);font-size:14px;font-weight:600;
  background:var(--ground);padding:3px 7px}

@media(max-width:900px){
  .split,.split.rev,.two{grid-template-columns:1fr}
  .track{border-right:0;border-bottom:1.5px solid var(--rule)}
  .track:last-child{border-bottom:0}
  .wrap{padding:0 20px}
  header{padding-top:24px}
  .top{margin-bottom:40px}
  section{padding:52px 0}
  body.ko p,body.ko ul,body.ko .lede,body.ko .note,body.ko .readouts>p{max-width:none}
}
@media(prefers-reduced-motion:reduce){
  .bar span{transition:none}
  .ln{transition:none}
}
@media(prefers-reduced-motion:no-preference){
  .ln{transition:stroke-width .22s ease,opacity .22s ease}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="top">
      <div class="id" data-i="ident"></div>
      <div class="switches">
        <div class="sw" role="group" data-i-label="langAria">
          <button type="button" data-lang="en" aria-pressed="true">English</button>
          <button type="button" data-lang="ko" aria-pressed="false">한국어</button>
        </div>
        <div class="sw" role="group" data-i-label="lvlAria">
          <button type="button" data-lvl="e" aria-pressed="false" data-i="lvlEasy"></button>
          <button type="button" data-lvl="t" aria-pressed="true" data-i="lvlPro"></button>
        </div>
      </div>
    </div>

    <span class="eyebrow" data-i="eyebrow"></span>
    <h1 data-i="h1"></h1>
    <p class="lede" data-i="lede"></p>

    <div class="reading">
      <div class="strip">
        <div class="striplabel">
          <span data-i="stripLabel"></span>
          <span><b id="stripPct"></b> <span id="stripCount"></span></span>
        </div>
        <div class="bar" role="img" aria-live="polite" id="barWrap"><span id="bar"></span></div>
      </div>
      <div class="body">
        <p class="marker" data-i="markTry"></p>
        <div class="sw ctl" role="radiogroup" data-i-label="readAria">
          <label><input type="radio" name="rd" value="pooled" checked><span data-i="rdAll"></span></label>
          <label><input type="radio" name="rd" value="cohort"><span data-i="rdFixed"></span></label>
        </div>
        <div id="heroSvg"></div>
        <div class="keys">
          <span><i style="background:var(--ochre)"></i><span data-i="keyAll"></span></span>
          <span><i style="background:var(--indigo)"></i><span data-i="keyFixed"></span></span>
        </div>
        <div class="readouts">
          <p id="rdPooled"></p>
          <p id="rdCohort" data-off></p>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <div id="err">
    <strong data-i="errTitle"></strong>
    <p style="margin:12px 0 0" data-i="errWhy"></p>
    <p style="margin:12px 0 0"><code>python3 -m http.server</code></p>
    <p style="margin:12px 0 0" data-i="errThen"></p>
    <p style="margin:16px 0 0" class="note" id="errDetail"></p>
  </div>
</div>

<main class="wrap">

<section id="a">
  <div class="head">
    <span class="tag">A</span>
    <span class="filters" data-i="aFilter"></span>
  </div>
  <h2 data-i="aH2"></h2>
  <p class="lede" style="margin-bottom:34px" data-i="aLede"></p>

  <div class="two">
    <div class="track ochre">
      <p class="tracktitle" data-i="aTrack1"></p>
      <p data-i="aP1"></p>
      <p data-i="aP2"></p>
    </div>
    <div class="track indigo">
      <p class="tracktitle" data-i="aTrack2"></p>
      <p data-i="aP3"></p>
      <p data-i="aP4"></p>
    </div>
  </div>

  <div class="split" style="margin-top:44px">
    <div>
      <figure>
        <div id="hazSvg"></div>
        <figcaption id="hazCap"></figcaption>
      </figure>
      <div class="figs" id="aFigs"></div>
    </div>
    <div>
      <h3 data-i="aH3"></h3>
      <p class="note" style="margin-bottom:20px" data-i="aH3note"></p>
      <div style="overflow-x:auto"><table id="alphaTbl"></table></div>
      <p class="note" style="margin-top:18px" data-i="aTail"></p>
    </div>
  </div>
</section>

<section id="b">
  <div class="head">
    <span class="tag">B</span>
    <span class="filters" data-i="bFilter"></span>
  </div>
  <h2 data-i="bH2"></h2>
  <p class="lede" style="margin-bottom:34px" data-i="bLede"></p>

  <div class="split rev">
    <div>
      <figure>
        <p class="marker" data-i="markPick"></p>
        <div class="f">
          <label for="winSel" data-i="bWin"></label>
          <select id="winSel" class="in"></select>
        </div>
        <div id="ruleSvg" style="margin-top:22px"></div>
        <figcaption id="ruleCap"></figcaption>
      </figure>
    </div>
    <div>
      <p data-i="bP1"></p>
      <p data-i="bP2"></p>
      <p data-i="bP3"></p>
      <div class="figs" id="bFigs"></div>
    </div>
  </div>

  <h3 style="margin-top:56px" data-i="bH3"></h3>
  <div class="split" style="margin-top:20px">
    <div>
      <p data-i="bR1"></p>
      <p data-i="bR2"></p>
      <p data-i="bR3"></p>
    </div>
    <div>
      <div class="panel">
        <p class="marker" data-i="markPick"></p>
        <div class="f">
          <label for="mcSel" data-i="bMin"></label>
          <select id="mcSel" class="in"></select>
        </div>
        <div style="overflow-x:auto;margin-top:22px"><table id="rankTbl"></table></div>
        <p class="note" style="margin-top:16px" id="rankNote"></p>
      </div>
    </div>
  </div>
</section>

<section id="c">
  <div class="head">
    <span class="tag">C</span>
    <span class="filters" data-i="cFilter"></span>
  </div>
  <h2 data-i="cH2"></h2>
  <p class="lede" style="margin-bottom:34px" data-i="cLede"></p>

  <div class="split">
    <div>
      <p data-i="cP1"></p>
      <p class="note" id="cRepro"></p>
      <p data-i="cP2"></p>
      <div class="figs" id="cFigs"></div>
    </div>
    <div>
      <figure>
        <div id="shareSvg"></div>
        <figcaption id="shareCap"></figcaption>
      </figure>
    </div>
  </div>

  <h3 style="margin-top:56px" data-i="cCalcH3"></h3>
  <div class="split rev" style="margin-top:20px">
    <div>
      <div class="panel">
        <p class="marker" data-i="markDrag"></p>
        <div class="f">
          <label for="liftR"><span data-i="cLiftLbl"></span><span class="v" id="liftV"></span></label>
          <input type="range" id="liftR" min="0" max="200" step="1" value="59">
          <button type="button" class="act" id="liftSnap" data-i="cSnap"></button>
        </div>
        <div class="res">
          <div><span class="rv" id="incA"></span><span class="rl" data-i="cRes1"></span></div>
          <div><span class="rv" id="incB"></span><span class="rl" data-i="cRes2"></span></div>
        </div>
      </div>
    </div>
    <div>
      <p data-i="cCalc1"></p>
      <p data-i="cCalc2"></p>
      <p class="note" data-i="cCalc3"></p>
    </div>
  </div>

  <h3 style="margin-top:56px" data-i="cExpH3"></h3>
  <div class="two" style="margin-top:20px">
    <div class="track ochre">
      <p class="tracktitle" data-i="cTrack1"></p>
      <p data-i="cExp1"></p>
    </div>
    <div class="track indigo">
      <p class="tracktitle" data-i="cTrack2"></p>
      <p data-i="cExp2"></p>
    </div>
  </div>
  <div class="split" style="margin-top:34px">
    <div>
      <figure>
        <div id="inflSvg"></div>
        <figcaption id="inflCap"></figcaption>
      </figure>
    </div>
    <div>
      <div style="overflow-x:auto"><table id="lateTbl"></table></div>
      <p class="note" style="margin-top:18px" data-i="cExpNote"></p>
    </div>
  </div>
</section>

<section id="d" hidden>
  <div class="head">
    <span class="tag">D</span>
    <span class="filters" data-i="dFilter"></span>
  </div>
  <h2 data-i="dH2"></h2>
  <p class="lede" style="margin-bottom:34px" data-i="dLede"></p>

  <div class="split">
    <div>

const el=(tg,a={})=>{const n=document.createElementNS(NS,tg);
  for(const k in a)n.setAttribute(k,a[k]);return n;};
const tx=(s,a={})=>{const n=el('text',Object.assign({fill:MUTED,

function lineChart(host,series,o){
  const W=580,H=o.h||300,P={t:16,r:18,b:38,l:54};
  const xs=series.flatMap(s=>s.pts.map(p=>p[0])),
        ys=series.flatMap(s=>s.pts.map(p=>p[1]));
  const x0=o.xMin??Math.min(...xs),x1=o.xMax??Math.max(...xs);
  let y0=o.yMin??Math.min(...ys),y1=o.yMax??Math.max(...ys);
  const pd=(y1-y0)*.08;y0-=pd;y1+=pd;
  const X=v=>P.l+(v-x0)/(x1-x0)*(W-P.l-P.r);
  const Y=v=>H-P.b-(v-y0)/(y1-y0)*(H-P.t-P.b);
  const s=sv(W,H,o.label);
  for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4;
    s.appendChild(el('line',{x1:P.l,x2:W-P.r,y1:Y(v),y2:Y(v),stroke:RULE}));
    s.appendChild(tx(o.fmtY?o.fmtY(v):v.toFixed(2),{x:P.l-10,y:Y(v)+4,'text-anchor':'end'}));}
  (o.ticksX||[]).forEach(v=>s.appendChild(tx(String(v),{x:X(v),y:H-P.b+20,'text-anchor':'middle'})));
  s.appendChild(el('line',{x1:P.l,x2:W-P.r,y1:H-P.b,y2:H-P.b,stroke:INK,'stroke-width':1.5}));
  series.forEach(sr=>{
    const d=sr.pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
    s.appendChild(el('path',{d,fill:'none',stroke:sr.color,'stroke-width':sr.w||2.4,
      'stroke-linejoin':'round','stroke-linecap':'round',opacity:sr.op??1,
      'stroke-dasharray':sr.dash||'',class:'ln'}));});
  host.replaceChildren(s);
}
function barChart(host,groups,o){
  const W=580,H=o.h||280,P={t:20,r:16,b:54,l:o.l??58};
  const max=o.max??Math.max(...groups.flatMap(x=>x.bars.map(b=>b.v)));
  const s=sv(W,H,o.label),gw=(W-P.l-P.r)/groups.length;
  const Y=v=>H-P.b-(v/max)*(H-P.t-P.b);
  for(let i=0;i<=4;i++){const v=max*i/4;
    s.appendChild(el('line',{x1:P.l,x2:W-P.r,y1:Y(v),y2:Y(v),stroke:RULE}));
    s.appendChild(tx(o.fmtY?o.fmtY(v):String(Math.round(v)),{x:P.l-10,y:Y(v)+4,'text-anchor':'end'}));}
  groups.forEach((gr,gi)=>{
    const n=gr.bars.length,bw=Math.min(54,(gw-20)/n),
          st=P.l+gi*gw+(gw-bw*n-(n-1)*6)/2;
    gr.bars.forEach((b,bi)=>{const x=st+bi*(bw+6);
      s.appendChild(el('rect',{x,y:Y(b.v),width:bw,height:Math.max(0,H-P.b-Y(b.v)),fill:b.color}));
      if(b.tag)s.appendChild(tx(b.tag,{x:x+bw/2,y:Y(b.v)-8,'text-anchor':'middle',
        fill:b.color,'font-size':'12','font-weight':'700'}));});
    String(gr.label).split('\n').forEach((ln,li)=>
      s.appendChild(tx(ln,{x:P.l+gi*gw+gw/2,y:H-P.b+20+li*15,'text-anchor':'middle'})));});
  host.replaceChildren(s);
}
function stackChart(host,items,o){
  const W=580,H=o.h||280,P={t:20,r:16,b:46,l:54};
  const s=sv(W,H,o.label),gw=(W-P.l-P.r)/items.length;
  const Y=v=>H-P.b-v*(H-P.t-P.b);
  for(let i=0;i<=4;i++){const v=i/4;
    s.appendChild(el('line',{x1:P.l,x2:W-P.r,y1:Y(v),y2:Y(v),stroke:RULE}));
    s.appendChild(tx(pct(v,0),{x:P.l-10,y:Y(v)+4,'text-anchor':'end'}));}
  items.forEach((it,i)=>{
    const bw=Math.min(82,gw-40),x=P.l+i*gw+(gw-bw)/2;
    s.appendChild(el('rect',{x,y:Y(1),width:bw,height:(H-P.b)-Y(1),fill:GREY}));
    s.appendChild(el('rect',{x,y:Y(it.share),width:bw,
      height:Math.max(0,(H-P.b)-Y(it.share)),fill:INDIGO}));
    s.appendChild(tx(pct(it.share),{x:x+bw/2,y:Y(it.share)-9,'text-anchor':'middle',
      fill:INDIGO,'font-size':'13','font-weight':'700'}));
    s.appendChild(tx(it.label,{x:P.l+i*gw+gw/2,y:H-P.b+20,'text-anchor':'middle'}));});
  host.replaceChildren(s);
}
function table(host,cap,head,rows){
  host.replaceChildren();
  if(cap){const c=document.createElement('caption');c.textContent=cap;host.appendChild(c);}
  const th=document.createElement('thead'),tr=document.createElement('tr');
  head.forEach(h=>{const e=document.createElement('th');e.textContent=h;tr.appendChild(e);});
  th.appendChild(tr);host.appendChild(th);
  const tb=document.createElement('tbody');
  rows.forEach(r=>{const row=document.createElement('tr');
    r.forEach(c=>{const e=document.createElement('td');
      if(c&&typeof c==='object'){e.textContent=c.t;if(c.cls)e.className=c.cls;}
      else e.textContent=c;row.appendChild(e);});
    tb.appendChild(row);});
  host.appendChild(tb);
}

const Z_A=1.959963985,Z_B=0.841621234;
const sampleSize=(p,mde)=>{const p2=p*(1+mde),pb=(p+p2)/2;
  return Math.pow(Z_A*Math.sqrt(2*pb*(1-pb))+Z_B*Math.sqrt(p*(1-p)+p2*(1-p2)),2)/Math.pow(p2-p,2);};

/* ---------- signature: coverage ---------- */
const COH=[5,8,12,15];
let mode='pooled';
function coverage(){
  const total=M.a.baselines.impressions;
  if(mode==='pooled')return {share:1,imp:total};
  const byLen=M.a.first_impression_by_length||[];
  let imp=0;
  COH.forEach(n=>{const r=byLen.find(x=>x.n===n);if(r)imp+=n*r.impressions;});
  if(!imp){const f=M.a.cohort_fits.filter(r=>r.definition==='n = K');
    COH.forEach(n=>{const r=f.find(x=>x.n===n);if(r)imp+=n*r.pairs;});}
  return {share:imp/total,imp};
}
function drawStrip(){
  const c=coverage();
  g('bar').style.width=(c.share*100).toFixed(2)+'%';
  g('bar').style.background=mode==='pooled'?OCHRE:INDIGO;
  g('stripPct').textContent=c.share>=0.995?'100%':pct(c.share,1);
  g('stripCount').textContent=K('stripCount')(fmt(M.a.baselines.impressions));
  g('barWrap').setAttribute('aria-label',g('stripPct').textContent+' '+g('stripCount').textContent);

    {label:'uniform',bars:[{v:r.uniform,color:OCHREL,tag:fmt(r.uniform)}]}],
    {h:250,max:max*1.16,l:62,fmtY:v=>(v/1000).toFixed(0)+'k',label:K('bH2')});
  g('ruleCap').textContent=K('ruleCap')(w,(r.last_click/r.first_click).toFixed(2),w===30);
}
function drawRank(){
  const ra=M.b.rank_agreement;
  const all=[...new Set(ra.map(r=>r.min_credit))].sort((a,b)=>a-b);
  const s0=+g('mcSel').value,mc=all.includes(s0)?s0:all[all.length-1];
  const rows=ra.filter(r=>r.min_credit===mc).sort((x,y)=>x.window-y.window||x.vs.localeCompare(y.vs));
  table(g('rankTbl'),K('rankCap')(mc),K('rankTh'),rows.map(r=>[
    r.window+'d',r.vs,r.campaigns,
    {t:sig(r.spearman),cls:r.spearman<0.95?'hi':'ok'},r.mean_shift.toFixed(1)]));
  const k=rows.find(r=>r.window===30&&r.vs==='all_clicks');
  g('rankNote').textContent=k?K('rankNote')(mc,k.campaigns,sig(k.spearman)):'';
}
function drawC(){
  const itt={};M.c.itt.forEach(r=>itt[r.outcome]=r);
  const cv=itt.conversions,vs=itt.visits,rep=M.c.paper_reproduction;
  g('cRepro').textContent=K('cRepro')(pct(rep.target_visit_rel_lift,1),
    pct(rep.target_conversion_rel_lift,1),pct(rep.measured_visit_rel_lift,2),
    pct(rep.measured_conversion_rel_lift,2));
  const F=K('cFig');
  figs(g('cFigs'),[[pct(cv.rel_lift,1),R(F[0])],
    [pct(cv.incremental_share,1),R(F[1])],
    [pct(M.c.dataset.exposure_rate_among_treated,1),R(F[2])]]);
  stackChart(g('shareSvg'),[{label:'visits',share:vs.incremental_share},
    {label:'conversions',share:cv.incremental_share}],{h:265,label:K('cP2')});
  g('shareCap').innerHTML=`<span style="color:${INDIGO}">■</span> ${K('shareCaused')}
    &nbsp;&nbsp;<span style="color:${GREY}">■</span> ${K('shareAnyway')}. ${K('shareCap')(fmt(cv.events_treated))}`;
  const ec={};M.c.exposure_conditioning.forEach(r=>ec[r.grp]=r);
  const pE=ec.exposed.conversions/ec.exposed.n,pC=ec.control.conversions/ec.control.n;
  const naive=pE/pC-1,infl=naive/cv.rel_lift;
  barChart(g('inflSvg'),[
    {label:K('barValid'),bars:[{v:Math.log10(1+cv.rel_lift),color:INDIGO,tag:pct(cv.rel_lift,0)}]},
    {label:K('barPost'),bars:[{v:Math.log10(1+naive),color:OCHRE,tag:pct(naive,0)}]}],
    {h:250,l:48,max:Math.log10(1+naive)*1.24,fmtY:v=>'10^'+v.toFixed(1),label:K('cExpH3')});
  g('inflCap').textContent=K('inflCap')(infl.toFixed(0));
  const lt={};M.c.late.forEach(r=>lt[r.outcome]=r);
  const P=lt.conversions,LR=K('lateRows');
  table(g('lateTbl'),K('lateCap'),K('lateTh'),[
    [LR[0],pct(P.never_taker_rate,3)],[LR[1],pct(P.control_rate,3)],
    [LR[2],{t:pct(P.complier_baseline,3),cls:'hi'}],[LR[3],pct(P.exposed_rate,3)],
    [LR[4],{t:'+'+pct(P.late,3),cls:'ok'}]]);
  liftCalc();
  return {naive,infl,cv};
}
function liftCalc(){
  const v=+g('liftR').value/100,sh=v/(1+v);
  g('liftV').textContent=pct(v,0);
  g('incA').textContent=pct(sh,1);
  g('incB').textContent=Math.round(sh*100);
}
function drawD(){
  if(!M.d)return;
  g('d').hidden=false;
  const ss=M.d.sample_size,pk=M.d.peeking_false_positive_rate,
        dd=M.d.days_needed,asm=M.d.assumptions;
  const at5=k=>ss.find(r=>r.mde_relative===0.05&&r.baseline.startsWith(k));
  const c5=at5('CTR'),v5=at5('Conversion'),w=pk[pk.length-1],b=pk[0];
  const F=K('dFig');
  figs(g('dFigs'),[[fmt(c5.n_per_arm),R(F[0])],[fmt(v5.n_per_arm),R(F[1])],
    [pct(b.fpr_ctr,1)+' to '+pct(w.fpr_ctr,1),R(F[2])(w.looks)]]);
  const grp={};ss.forEach(r=>{(grp[r.baseline]=grp[r.baseline]||[]).push(r);});
  const cols={'CTR':OCHRE,'Conversion':INDIGO,'Visit':INDIGOL};
  lineChart(g('ssSvg'),Object.entries(grp).map(([nm,rs])=>{
    const key=Object.keys(cols).find(k=>nm.startsWith(k))||'CTR';
    return {pts:rs.slice().sort((a,b)=>a.mde_relative-b.mde_relative)
      .map(r=>[Math.log10(r.mde_relative*100),Math.log10(r.n_per_arm)]),color:cols[key]};}),
    {h:265,ticksX:[0,0.5,1,1.5],fmtY:v=>'10^'+v.toFixed(1),label:K('ssCap')});
  const rows=dd.filter(r=>String(r.rollout??r.rollout_share)==='3%'||Number(r.rollout_share)===0.03);
  table(g('daysTbl'),K('daysCap')(fmt(asm.daily_eligible_users_assumed)),K('daysTh'),
    (rows.length?rows:dd.slice(0,4)).map(r=>[r.mde??pct(r.mde_relative,0),
      Number(r.days_ctr).toFixed(1),
      {t:Number(r.days_conv).toFixed(1),cls:Number(r.days_conv)>60?'hi':''}]));
  lineChart(g('peekSvg'),[
    {pts:pk.map(r=>[r.looks,r.fpr_ctr]),color:OCHRE},
    {pts:pk.map(r=>[r.looks,r.fpr_conv]),color:OCHREL},
    {pts:[[b.looks,asm.alpha],[w.looks,asm.alpha]],color:MUTED,w:1.4,dash:'6 4'}],
    {h:250,ticksX:pk.map(r=>r.looks),fmtY:v=>pct(v,0),label:K('dPeekH3')});
  g('peekCap').textContent=K('peekCap')(pct(asm.alpha,0));
  const ps=g('preSel');ps.replaceChildren();
  K('dPresets').forEach(([v,lab])=>{const o=document.createElement('option');
    o.value=v;o.textContent=lab;ps.appendChild(o);});
  ssCalc();
}
function ssCalc(){
  const p=Math.max(0.0001,(+g('baseN').value)/100),
        mde=(+g('mdeR').value)/100,
        daily=Math.max(1,+g('dailyN').value),
        roll=(+g('rollR').value)/100;
  g('mdeV').textContent=pct(mde,0);
  g('rollV').textContent=pct(roll,0);
  const n=sampleSize(p,mde),days=n/(daily*roll*0.5);
  g('ssOut').textContent=fmt(n);
  g('dayOut').textContent=days<1?'<1':(days<10?days.toFixed(1):fmt(days));
}
function drawTail(naive,infl,cv){
  const pb=M.a.pooled_by_order,p0=pb[0].ctr,p1=pb[pb.length-1].ctr;
  const PR=K('pairRows'),PA=K('pairA'),PC=K('pairC');
  table(g('pairTbl'),null,K('pairTh'),[
    [PR[0],K('pairDataA')(fmt(M.a.baselines.impressions)),
           K('pairDataC')(fmt(cv.n_control+cv.n_treated))],
    [PR[1],K('pairVarA'),K('pairVarC')],
    [PR[2],PA[0],PC[0]],
    [PR[3],PA[1]+' '+sig(p0)+' to '+sig(p1),PC[1]+' '+pct(naive,0)],
    [PR[4],PA[2],PC[2]+' '+pct(cv.rel_lift,1)],
    [PR[5],PA[3],infl.toFixed(0)+PC[3]]]);
  const pop=M.b.population;
  const args=[null,pct(M.a.baselines.pooled_ctr,2),
    pct(1-pop.observed_share_of_path_clicks,0),null,null,null,
    fmt(pop.attributed_conversions)];
  g('limList').innerHTML=T[LANG].lim.map((x,i)=>{const v=R(x);
    return '<li>'+(typeof v==='function'?v(args[i]):v)+'</li>';}).join('');
}
function applyStatic(){
  document.documentElement.lang=LANG;
  document.title=K('docTitle');
  const md=g('metaDesc');if(md)md.setAttribute('content',K('metaDesc'));
  document.body.className=(LANG==='ko'?'ko':'');
  document.querySelectorAll('[data-i]').forEach(n=>{
    const v=K(n.getAttribute('data-i'));
    if(typeof v==='string'){if(/<[a-z]/i.test(v))n.innerHTML=v;else n.textContent=v;}});
  document.querySelectorAll('[data-i-label]').forEach(n=>{
    const v=K(n.getAttribute('data-i-label'));
    if(typeof v==='string')n.setAttribute('aria-label',v);});
  document.querySelectorAll('button[data-lang]').forEach(b=>
    b.setAttribute('aria-pressed',String(b.getAttribute('data-lang')===LANG)));
  document.querySelectorAll('button[data-lvl]').forEach(b=>
    b.setAttribute('aria-pressed',String(b.getAttribute('data-lvl')===LVL)));
}
function renderAll(){
  applyStatic();heroText();drawHero();drawA();drawB();
  const r=drawC();drawD();drawTail(r.naive,r.infl,r.cv);
}
function syncUrl(){
  if(!history.replaceState)return;
  const u=new URL(location.href);
  u.searchParams.set('lang',LANG);u.searchParams.set('level',LVL);
  history.replaceState(null,'',u);
}
function relabelWin(){
  [...g('winSel').options].forEach(o=>
    o.textContent=o.value+(LANG==='ko'?'일':(' day'+(+o.value>1?'s':''))));
}
function boot(){
  const ws=[...new Set(M.b.rule_totals_by_window.map(r=>r.window_days))].sort((a,b)=>a-b);
  ws.forEach(w=>{const o=document.createElement('option');o.value=w;
    if(w===30)o.selected=true;g('winSel').appendChild(o);});
  const mcs=[...new Set(M.b.rank_agreement.map(r=>r.min_credit))].sort((a,b)=>a-b);
  mcs.forEach(m=>{const o=document.createElement('option');o.value=m;
    o.textContent=String(m);if(m===200)o.selected=true;g('mcSel').appendChild(o);});
  relabelWin();
  document.querySelectorAll('input[name=rd]').forEach(r=>
    r.addEventListener('change',e=>{mode=e.target.value;drawHero();}));
  g('winSel').addEventListener('change',drawRules);
  g('mcSel').addEventListener('change',drawRank);
  g('liftR').addEventListener('input',liftCalc);
  g('liftSnap').addEventListener('click',()=>{
    const cv=M.c.itt.find(r=>r.outcome==='conversions');
    g('liftR').value=Math.round(cv.rel_lift*100);liftCalc();});
  ['baseN','mdeR','dailyN','rollR'].forEach(i=>{
    const n=g(i);if(n)n.addEventListener('input',ssCalc);});
  const ps=g('preSel');
  if(ps)ps.addEventListener('change',()=>{g('baseN').value=ps.value;ssCalc();});
  document.querySelectorAll('button[data-lang]').forEach(b=>
    b.addEventListener('click',()=>{LANG=b.getAttribute('data-lang');
      syncUrl();relabelWin();renderAll();}));
  document.querySelectorAll('button[data-lvl]').forEach(b=>
    b.addEventListener('click',()=>{LVL=b.getAttribute('data-lvl');syncUrl();renderAll();}));
  renderAll();
}
load().then(boot).catch(e=>{
  applyStatic();console.error(e);
  g('err').style.display='block';
  g('errDetail').textContent=K('errDetail')(e.message,location.protocol);
});
</script>
</body>
</html>

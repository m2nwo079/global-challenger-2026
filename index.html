<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What the logs cannot tell you</title>
<meta name="description" id="metaDesc" content="Three measurements on public Criteo advertising logs, showing how conditioning choices reverse the conclusion.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17181A; --paper:#EFEDE6; --card:#F8F7F3;
  --rule:#CBC7BA; --rule-soft:#DEDBD0; --muted:#6A685F;
  --plum:#7A2246; --plum-soft:#C68DA5;
  --teal:#0F5F55; --teal-soft:#7FB3A9;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --serif:'Source Serif 4',Georgia,serif;
  --disp:'IBM Plex Mono',ui-monospace,monospace;
}
body.ko{
  --serif:'Noto Serif KR','Source Serif 4',Georgia,serif;
  --disp:'IBM Plex Mono','IBM Plex Sans KR',sans-serif;
  --mono:'IBM Plex Mono','IBM Plex Sans KR',monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--serif);font-size:17px;line-height:1.65;
  font-variant-numeric:tabular-nums}
body.ko{line-height:1.78;font-size:16.5px}
.wrap{max-width:1080px;margin:0 auto;padding:0 28px}
a{color:var(--teal);text-underline-offset:2px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--plum);outline-offset:3px}

h1,h2,h3{font-family:var(--disp)}
.eyebrow,.num,.label,table,.legend,.toggle,.marker,figcaption,.panel{font-family:var(--mono)}
h1{font-size:clamp(29px,5vw,56px);font-weight:500;line-height:1.06;letter-spacing:-.03em;margin:0 0 18px;max-width:20ch}
body.ko h1{font-weight:600;letter-spacing:-.02em;line-height:1.22;max-width:17ch}
h2{font-size:clamp(21px,2.6vw,27px);font-weight:500;letter-spacing:-.02em;margin:0 0 6px}
body.ko h2{font-weight:600;letter-spacing:-.01em}
h3{font-size:15px;font-weight:500;letter-spacing:.01em;margin:34px 0 8px}
p{margin:0 0 16px;max-width:66ch}
body.ko p{max-width:44ch}
.lede{font-size:clamp(18px,2.1vw,21px);line-height:1.55;max-width:52ch}
body.ko .lede{line-height:1.7;max-width:36ch}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;display:block}
.small{font-size:14px;color:var(--muted);line-height:1.55;max-width:60ch}
body.ko .small{max-width:42ch;line-height:1.7}
.mono{font-family:var(--mono)}

header{padding:56px 0 0}
.masthead{display:flex;justify-content:space-between;align-items:baseline;gap:16px;
  flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:12px;margin-bottom:48px}
.masthead span{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.langBtns{display:flex;gap:0;border:1px solid var(--rule)}
.langBtns button{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;padding:5px 10px;background:transparent;color:var(--muted);
  border:0;border-right:1px solid var(--rule);cursor:pointer}
.langBtns button:last-child{border-right:0}
.langBtns button[aria-pressed=true]{background:var(--ink);color:var(--paper)}

.heroChart{margin:34px 0 0;background:var(--card);border:1px solid var(--rule-soft);padding:22px 20px 14px}
.toggle{display:flex;flex-wrap:wrap;border:1px solid var(--ink);width:fit-content;margin:0 0 20px}
.toggle label{font-size:12.5px;padding:9px 15px;cursor:pointer;border-right:1px solid var(--ink);user-select:none}
.toggle label:last-child{border-right:0}
.toggle input{position:absolute;opacity:0;width:0;height:0}
.toggle label:has(input:checked){background:var(--ink);color:var(--paper)}
.readout{font-family:var(--serif);font-size:clamp(17px,2.1vw,20px);line-height:1.5;margin:18px 0 0;max-width:60ch;min-height:3.2em}
body.ko .readout{max-width:42ch;line-height:1.72}
.readout b{font-family:var(--mono);font-weight:500;font-size:.94em}
.legend{display:flex;gap:20px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:14px 0 0}
.legend i{display:inline-block;width:15px;height:2px;vertical-align:3px;margin-right:6px}

section{padding:64px 0;border-top:1px solid var(--rule)}
.marker{font-size:12px;letter-spacing:.03em;color:var(--plum);margin:0 0 10px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:44px;align-items:start}
.cols.rev{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}

figure{margin:0;background:var(--card);border:1px solid var(--rule-soft);padding:18px 16px 10px}
figcaption{font-size:11.5px;color:var(--muted);line-height:1.6;padding:10px 2px 4px}
table{width:100%;border-collapse:collapse;font-size:13px}
caption{text-align:left;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-bottom:10px}
th,td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--rule-soft)}
th:first-child,td:first-child{text-align:left}
thead th{font-weight:500;border-bottom:1px solid var(--ink);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.hi{color:var(--plum)} td.ok{color:var(--teal)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;
  background:var(--rule-soft);border:1px solid var(--rule-soft);margin:26px 0 0}
.stat{background:var(--card);padding:16px 15px}
.stat .num{display:block;font-size:25px;font-weight:500;letter-spacing:-.02em;line-height:1.12}
.stat .label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);margin-top:7px;line-height:1.5}
body.ko .stat .label{letter-spacing:0;text-transform:none;font-size:11.5px}

select,input[type=number]{font-family:var(--mono);font-size:13px;padding:6px 9px;
  border:1px solid var(--ink);background:var(--card);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--plum);margin:6px 0}
.panel{background:var(--card);border:1px solid var(--rule-soft);padding:18px 17px}
.field{margin-bottom:16px}
.field>label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
body.ko .field>label{letter-spacing:.02em;text-transform:none;font-size:12px}
.field .val{font-size:13px;color:var(--ink);float:right;letter-spacing:0;text-transform:none}
.out{border-top:1px solid var(--rule);margin-top:18px;padding-top:14px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px}
.out div span{display:block}
.out .ov{font-size:22px;font-weight:500;letter-spacing:-.02em;line-height:1.15}
.out .ol{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:5px;line-height:1.45}
body.ko .out .ol{letter-spacing:0;text-transform:none;font-size:11.5px}
.snap{font-family:var(--mono);font-size:11px;padding:5px 9px;border:1px solid var(--ink);
  background:transparent;color:var(--ink);cursor:pointer;margin-top:4px}

.parallel table{font-size:13.5px}
.parallel td{vertical-align:top;text-align:left;line-height:1.55}
.parallel th{text-align:left}
.parallel th:nth-child(2){color:var(--plum)}
.parallel th:nth-child(3){color:var(--teal)}
.parallel td:first-child{color:var(--muted);width:23%;font-size:11.5px}

ul{padding-left:20px;max-width:64ch}
body.ko ul{max-width:46ch}
li{margin-bottom:9px}
footer{padding:48px 0 78px;border-top:1px solid var(--rule);color:var(--muted);font-size:14px}
footer p{max-width:64ch}
#err{display:none;margin:36px 0;padding:20px;border:1px solid var(--plum);background:var(--card);font-size:15px}
#err code{font-family:var(--mono);font-size:13px;background:var(--paper);padding:2px 5px}

@media(max-width:820px){
  .cols,.cols.rev{grid-template-columns:1fr;gap:26px}
  .wrap{padding:0 20px}
  header{padding-top:32px}
  section{padding:44px 0}
  body.ko p,body.ko .small,body.ko .lede,body.ko ul,body.ko .readout{max-width:none}
}
@media(prefers-reduced-motion:no-preference){
  .ln{transition:stroke-width .25s ease,opacity .25s ease}
  .bar{transition:opacity .25s ease}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="masthead">
      <span data-i="mastLeft"></span>
      <div class="langBtns">
        <button type="button" data-lang="en" aria-pressed="true">English</button>
        <button type="button" data-lang="ko" aria-pressed="false">한국어</button>
      </div>
      <span data-i="mastRight"></span>
    </div>
    <span class="eyebrow" data-i="heroEyebrow"></span>
    <h1 data-i="heroH1"></h1>
    <p class="lede" data-i="heroLede"></p>

    <div class="heroChart">
      <div class="toggle" role="radiogroup" data-i-label="heroTogAria">
        <label><input type="radio" name="hero" value="pooled" checked> <span data-i="togPooled"></span></label>
        <label><input type="radio" name="hero" value="cohort"> <span data-i="togCohort"></span></label>
      </div>
      <div id="heroSvg" aria-live="polite"></div>
      <div class="legend">
        <span><i style="background:var(--plum)"></i><span data-i="legPooled"></span></span>
        <span><i style="background:var(--teal)"></i><span data-i="legCohort"></span></span>
      </div>
      <p class="readout" id="heroReadout"></p>
    </div>
  </div>
</header>

<div class="wrap">
  <div id="err">
    <strong data-i="errTitle"></strong>
    <p style="margin:10px 0 0" data-i="errP1"></p>
    <p style="margin:10px 0 0" data-i="errP2"></p>
    <p style="margin:10px 0 0"><code>python3 -m http.server</code> &nbsp;·&nbsp; <code>http://localhost:8000</code></p>
    <p style="margin:14px 0 0" class="small" id="errDetail"></p>
  </div>
</div>

<main class="wrap">

<section id="a">
  <p class="marker" data-i="aMarker"></p>
  <h2 data-i="aH2"></h2>
  <div class="cols">
    <div>
      <p data-i="aP1"></p>
      <p data-i="aP2"></p>
      <p data-i="aP3"></p>
      <div class="stats" id="aStats"></div>
    </div>
    <div>
      <figure>
        <div id="hazardSvg"></div>
        <figcaption id="hazardCap"></figcaption>
      </figure>
      <h3 data-i="aH3alpha"></h3>
      <div style="overflow-x:auto"><table id="alphaTable"></table></div>
      <p class="small" style="margin-top:14px" data-i="aAlphaNote"></p>
    </div>
  </div>
</section>

<section id="b">
  <p class="marker" data-i="bMarker"></p>
  <h2 data-i="bH2"></h2>
  <div class="cols rev">
    <div>
      <figure>
        <div class="field" style="margin-bottom:14px">
          <label for="winSel" data-i="bWinLabel"></label>
          <select id="winSel"></select>
        </div>
        <div id="ruleSvg"></div>
        <figcaption id="ruleCap"></figcaption>
      </figure>
    </div>
    <div>
      <p data-i="bP1"></p>
      <p data-i="bP2"></p>
      <p data-i="bP3"></p>
      <div class="stats" id="bStats"></div>
    </div>
  </div>

  <h3 data-i="bH3rank"></h3>
  <div class="cols">
    <div>
      <p data-i="bRankP1"></p>
      <p data-i="bRankP2"></p>
      <p data-i="bRankP3"></p>
    </div>
    <div>
      <div class="field">
        <label for="mcSel" data-i="bMinLabel"></label>
        <select id="mcSel"></select>
      </div>
      <div style="overflow-x:auto"><table id="rankTable"></table></div>
      <p class="small" style="margin-top:12px" id="rankNote"></p>
    </div>
  </div>
</section>

<section id="c">
  <p class="marker" data-i="cMarker"></p>
  <h2 data-i="cH2"></h2>
  <div class="cols">
    <div>
      <p data-i="cP1"></p>
      <p class="small" id="cRepro"></p>
      <p data-i="cP2"></p>
      <div class="stats" id="cStats"></div>
    </div>
    <div>
      <figure>
        <div id="shareSvg"></div>
        <figcaption id="shareCap"></figcaption>
      </figure>
    </div>
  </div>

  <h3 data-i="cCalcH3"></h3>
  <div class="cols rev">
    <div>
      <div class="panel">
        <div class="field">
          <label for="liftR"><span data-i="cCalcLabel"></span><span class="val" id="liftV"></span></label>
          <input type="range" id="liftR" min="0" max="200" step="1" value="59">
          <button type="button" class="snap" id="liftSnap" data-i="cCalcSnap"></button>
        </div>
        <div class="out">
          <div><span class="ov" id="incOut"></span><span class="ol" data-i="cOut1"></span></div>
          <div><span class="ov" id="incOut2"></span><span class="ol" data-i="cOut2"></span></div>
        </div>
      </div>
      <p class="small" style="margin-top:16px" data-i="cCalcNote"></p>
    </div>
    <div>
      <p data-i="cCalcP1"></p>
      <p data-i="cCalcP2"></p>
    </div>
  </div>

  <h3 data-i="cH3exp"></h3>
  <div class="cols rev">
    <div>
      <figure>
        <div id="inflSvg"></div>
        <figcaption id="inflCap"></figcaption>
      </figure>
    </div>
    <div>
      <p data-i="cExpP1"></p>
      <p data-i="cExpP2"></p>
      <div style="overflow-x:auto;margin:18px 0 0"><table id="lateTable"></table></div>
      <p class="small" style="margin-top:14px" data-i="cExpNote"></p>
    </div>
  </div>
</section>

<section id="d" hidden>
  <p class="marker" data-i="dMarker"></p>
  <h2 data-i="dH2"></h2>
  <div class="cols">
    <div>
      <p data-i="dP1"></p>
      <p data-i="dP2"></p>
      <div class="stats" id="dStats"></div>
      <p class="small" style="margin-top:24px" data-i="dNote"></p>
    </div>
    <div>
      <figure>
        <div id="ssSvg"></div>
        <figcaption data-i="ssCap"></figcaption>
      </figure>
      <h3 data-i="dDaysH3"></h3>
      <div style="overflow-x:auto"><table id="daysTable"></table></div>
    </div>
  </div>

  <h3 data-i="dCalcH3"></h3>
  <div class="cols">
    <div>
      <p data-i="dCalcP1"></p>
      <p data-i="dCalcP2"></p>
    </div>
    <div>
      <div class="panel">
        <div class="field">
          <label for="preSel" data-i="dcPreset"></label>
          <select id="preSel"></select>
        </div>
        <div class="field">
          <label for="baseN"><span data-i="dcBase"></span></label>
          <input type="number" id="baseN" step="0.01" min="0.01" max="99" value="0.30" style="width:110px"> <span class="mono" style="font-size:13px">%</span>
        </div>
        <div class="field">
          <label for="mdeR"><span data-i="dcMde"></span><span class="val" id="mdeV"></span></label>
          <input type="range" id="mdeR" min="1" max="50" step="1" value="5">
        </div>
        <div class="field">
          <label for="dailyN" data-i="dcDaily"></label>
          <input type="number" id="dailyN" step="10000" min="1000" value="1000000" style="width:150px">
        </div>
        <div class="field">
          <label for="rollR"><span data-i="dcRoll"></span><span class="val" id="rollV"></span></label>
          <input type="range" id="rollR" min="1" max="100" step="1" value="3">
        </div>
        <div class="out">
          <div><span class="ov" id="ssOut"></span><span class="ol" data-i="dcOut1"></span></div>
          <div><span class="ov" id="dayOut"></span><span class="ol" data-i="dcOut2"></span></div>
        </div>
      </div>
    </div>
  </div>

  <h3 data-i="dPeekH3"></h3>
  <div class="cols rev">
    <div>
      <figure>
        <div id="peekSvg"></div>
        <figcaption id="peekCap"></figcaption>
      </figure>
    </div>
    <div>
      <p data-i="peekP1"></p>
      <p data-i="peekP2"></p>
      <p data-i="peekP3"></p>
    </div>
  </div>
</section>

<section id="thesis" class="parallel">
  <p class="marker" data-i="thMarker"></p>
  <h2 data-i="thH2"></h2>
  <p data-i="thP"></p>
  <div style="overflow-x:auto;margin-top:30px"><table id="parTable"></table></div>
</section>

<section id="limits">
  <p class="marker" data-i="limMarker"></p>
  <h2 data-i="limH2"></h2>
  <div class="cols">
    <div><ul id="limitList"></ul></div>
    <div>
      <h3 style="margin-top:0" data-i="rulesH3"></h3>
      <p class="small" data-i="rulesP1"></p>
      <p class="small" data-i="rulesP2"></p>
    </div>
  </div>
</section>

</main>

<footer class="wrap">
  <p data-i="foot1"></p>
  <p style="margin-top:14px" data-i="foot2"></p>
  <p style="margin-top:14px" data-i="foot3"></p>
</footer>

const T={
en:{
 docTitle:'What the logs cannot tell you',

const q=new URLSearchParams(location.search).get('lang');
const navLang=(typeof navigator!=='undefined'&&navigator.language)||'';

/* ---------- svg helpers ---------- */
const NS='http://www.w3.org/2000/svg';
const PLUM='#7A2246',PLUMS='#C68DA5',TEAL='#0F5F55',TEALS='#7FB3A9',
      INK='#17181A',MUTED='#6A685F',RULE='#DEDBD0',GREY='#DDD9CC';
const el=(tg,a={})=>{const n=document.createElementNS(NS,tg);
  for(const k in a)n.setAttribute(k,a[k]);return n;};
const txt=(s,a={})=>{const n=el('text',Object.assign({fill:MUTED,
  'font-family':"'IBM Plex Mono',monospace",'font-size':'10.5'},a));
  n.textContent=s;return n;};
const pct=(v,d=1)=>(v*100).toFixed(d)+'%';
const fmt=n=>Math.round(n).toLocaleString('en-US');
const sig=(v,d=3)=>Number(v).toFixed(d);
const svg=(w,h,lbl)=>el('svg',{viewBox:`0 0 ${w} ${h}`,width:'100%',role:'img',
  'aria-label':lbl||'chart',style:'display:block;overflow:visible'});

function lineChart(host,series,o){
  const W=560,H=o.h||300,P={t:14,r:16,b:34,l:48};
  const xs=series.flatMap(s=>s.pts.map(p=>p[0]));
  const ys=series.flatMap(s=>s.pts.map(p=>p[1]));
  const x0=o.xMin??Math.min(...xs),x1=o.xMax??Math.max(...xs);
  let y0=o.yMin??Math.min(...ys),y1=o.yMax??Math.max(...ys);
  const pd=(y1-y0)*0.08;y0-=pd;y1+=pd;
  const X=v=>P.l+(v-x0)/(x1-x0)*(W-P.l-P.r);
  const Y=v=>H-P.b-(v-y0)/(y1-y0)*(H-P.t-P.b);
  const s=svg(W,H,o.label);
  const ty=o.ticksY||4;
  for(let i=0;i<=ty;i++){const v=y0+(y1-y0)*i/ty;
    s.appendChild(el('line',{x1:P.l,x2:W-P.r,y1:Y(v),y2:Y(v),stroke:RULE}));
    s.appendChild(txt(o.fmtY?o.fmtY(v):v.toFixed(2),{x:P.l-8,y:Y(v)+3.5,'text-anchor':'end'}));}
  (o.ticksX||[]).forEach(v=>s.appendChild(
    txt(String(v),{x:X(v),y:H-P.b+18,'text-anchor':'middle'})));
  s.appendChild(el('line',{x1:P.l,x2:W-P.r,y1:H-P.b,y2:H-P.b,stroke:INK}));
  series.forEach(sr=>{
    const d=sr.pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
    s.appendChild(el('path',{d,fill:'none',stroke:sr.color,'stroke-width':sr.w||2,
      'stroke-linejoin':'round','stroke-linecap':'round',opacity:sr.op??1,
      'stroke-dasharray':sr.dash||'',class:'ln'}));});
  if(o.xLabel)s.appendChild(txt(o.xLabel,{x:(P.l+W-P.r)/2,y:H-2,'text-anchor':'middle','font-size':'10'}));
  if(o.yLabel)s.appendChild(txt(o.yLabel,{x:P.l,y:P.t-2,'font-size':'10'}));
  host.replaceChildren(s);
}

function barChart(host,groups,o){
  const W=560,H=o.h||280,P={t:16,r:14,b:48,l:o.l??52};
  const max=o.max??Math.max(...groups.flatMap(g=>g.bars.map(b=>b.v)));
  const s=svg(W,H,o.label);
  const gw=(W-P.l-P.r)/groups.length;
  const Y=v=>H-P.b-(v/max)*(H-P.t-P.b);
  for(let i=0;i<=4;i++){const v=max*i/4;
    s.appendChild(el('line',{x1:P.l,x2:W-P.r,y1:Y(v),y2:Y(v),stroke:RULE}));
    s.appendChild(txt(o.fmtY?o.fmtY(v):String(Math.round(v)),
      {x:P.l-8,y:Y(v)+3.5,'text-anchor':'end'}));}
  groups.forEach((g,gi)=>{
    const n=g.bars.length,bw=Math.min(46,(gw-18)/n);
    const st=P.l+gi*gw+(gw-bw*n-(n-1)*6)/2;
    g.bars.forEach((b,bi)=>{const x=st+bi*(bw+6);
      s.appendChild(el('rect',{x,y:Y(b.v),width:bw,
        height:Math.max(0,H-P.b-Y(b.v)),fill:b.color,class:'bar'}));
      if(b.tag)s.appendChild(txt(b.tag,{x:x+bw/2,y:Y(b.v)-6,
        'text-anchor':'middle',fill:b.color,'font-size':'10.5'}));});
    String(g.label).split('\n').forEach((ln,li)=>
      s.appendChild(txt(ln,{x:P.l+gi*gw+gw/2,y:H-P.b+17+li*13,
        'text-anchor':'middle','font-size':'10.5'})));});
  host.replaceChildren(s);
}

function stackChart(host,items,o){
  const W=560,H=o.h||280,P={t:16,r:14,b:44,l:52};
  const s=svg(W,H,o.label);
  const gw=(W-P.l-P.r)/items.length;
  const Y=v=>H-P.b-v*(H-P.t-P.b);
  for(let i=0;i<=4;i++){const v=i/4;
    s.appendChild(el('line',{x1:P.l,x2:W-P.r,y1:Y(v),y2:Y(v),stroke:RULE}));
    s.appendChild(txt(pct(v,0),{x:P.l-8,y:Y(v)+3.5,'text-anchor':'end'}));}
  items.forEach((it,i)=>{
    const bw=Math.min(74,gw-40),x=P.l+i*gw+(gw-bw)/2;
    s.appendChild(el('rect',{x,y:Y(1),width:bw,height:(H-P.b)-Y(1),fill:GREY}));
    s.appendChild(el('rect',{x,y:Y(it.share),width:bw,
      height:Math.max(0,(H-P.b)-Y(it.share)),fill:TEAL}));
    s.appendChild(txt(pct(it.share),{x:x+bw/2,y:Y(it.share)-7,
      'text-anchor':'middle',fill:TEAL,'font-size':'11'}));
    s.appendChild(txt(it.label,{x:P.l+i*gw+gw/2,y:H-P.b+18,
      'text-anchor':'middle','font-size':'10.5'}));});
  host.replaceChildren(s);
}

function table(host,cap,head,rows){
  host.replaceChildren();
  if(cap){const c=document.createElement('caption');c.textContent=cap;host.appendChild(c);}
  const th=document.createElement('thead'),tr=document.createElement('tr');
  head.forEach(h=>{const e=document.createElement('th');e.textContent=h;tr.appendChild(e);});
  th.appendChild(tr);host.appendChild(th);
  const tb=document.createElement('tbody');
  rows.forEach(r=>{const row=document.createElement('tr');
    r.forEach(c=>{const e=document.createElement('td');
      if(c&&typeof c==='object'){e.textContent=c.t;if(c.cls)e.className=c.cls;}
      else e.textContent=c;row.appendChild(e);});
    tb.appendChild(row);});
  host.appendChild(tb);
}
const g=i=>document.getElementById(i);
const stats=(host,arr)=>{host.innerHTML=arr.map(([n,l])=>
  `<div class="stat"><span class="num">${n}</span><span class="label">${l}</span></div>`).join('');};

const files={a:'output/module_a.json',b:'output/module_b.json',
             c:'output/module_c.json',d:'output/module_d.json'};
const M={};
async function load(){
  for(const k of ['a','b','c']){
    let r;
    try{r=await fetch(files[k]);}catch(e){throw new Error('request for '+files[k]+' was blocked');}
    if(!r.ok)throw new Error(files[k]+' returned HTTP '+r.status);
    try{M[k]=await r.json();}catch(e){throw new Error(files[k]+' is not valid JSON');}
  }
  try{const r=await fetch(files.d);if(r.ok)M.d=await r.json();}catch(e){}
}

/* ---------- stats formula (mirrors the python) ---------- */
const Z_A=1.959963985,Z_B=0.841621234;
function sampleSize(p,mde){
  const p2=p*(1+mde),pb=(p+p2)/2;
  const num=Math.pow(Z_A*Math.sqrt(2*pb*(1-pb))
    +Z_B*Math.sqrt(p*(1-p)+p2*(1-p2)),2);
  return num/Math.pow(p2-p,2);
}

function drawRules(){
  const L=t(),tot=M.b.rule_totals_by_window;
  const w=+g('winSel').value||Math.max(...tot.map(x=>x.window_days));

  barChart(g('ruleSvg'),[
    {label:'last\nclick',bars:[{v:r.last_click,color:TEAL,tag:fmt(r.last_click)}]},
    {label:'first\nclick',bars:[{v:r.first_click,color:TEALS,tag:fmt(r.first_click)}]},
    {label:'all\nclicks',bars:[{v:r.all_clicks,color:PLUM,tag:fmt(r.all_clicks)}]},

    {h:250,max:max*1.12,l:58,fmtY:v=>(v/1000).toFixed(0)+'k',label:L.bH2});
  g('ruleCap').textContent=L.ruleCap(w,(r.last_click/r.first_click).toFixed(2),w===30);

function drawRank(){
  const L=t(),ra=M.b.rank_agreement;
  const mcAll=[...new Set(ra.map(r=>r.min_credit))].sort((a,b)=>a-b);
  const sv=+g('mcSel').value;
  const mc=mcAll.includes(sv)?sv:mcAll[mcAll.length-1];
  const rows=ra.filter(r=>r.min_credit===mc)
    .sort((x,y)=>x.window-y.window||x.vs.localeCompare(y.vs));
  table(g('rankTable'),L.rankCap(mc),L.rankTh,rows.map(r=>[
    r.window+'d',r.vs,r.campaigns,
    {t:sig(r.spearman),cls:r.spearman<0.95?'hi':'ok'},r.mean_shift.toFixed(1)]));
  const k=rows.find(r=>r.window===30&&r.vs==='all_clicks');
  g('rankNote').textContent=k?L.rankNote(mc,k.campaigns,sig(k.spearman)):'';
}

function drawC(){
  const L=t(),itt={};M.c.itt.forEach(r=>itt[r.outcome]=r);
  const cv=itt.conversions,vs=itt.visits,rep=M.c.paper_reproduction;
  g('cRepro').textContent=L.cRepro(pct(rep.target_visit_rel_lift,1),
    pct(rep.target_conversion_rel_lift,1),
    pct(rep.measured_visit_rel_lift,2),pct(rep.measured_conversion_rel_lift,2));
  stats(g('cStats'),[
    [pct(cv.rel_lift,1),L.cS1],
    [pct(cv.incremental_share,1),L.cS2],
    [pct(M.c.dataset.exposure_rate_among_treated,1),L.cS3]]);
  stackChart(g('shareSvg'),[{label:'visits',share:vs.incremental_share},
    {label:'conversions',share:cv.incremental_share}],{h:260,label:L.cP2});
  g('shareCap').innerHTML=`<span style="color:${TEAL}">■</span> ${L.shareCaused}
    &nbsp; <span style="color:${GREY}">■</span> ${L.shareAnyway}. ${L.shareCap(fmt(cv.events_treated))}`;

  const ec={};M.c.exposure_conditioning.forEach(r=>ec[r.grp]=r);
  const pE=ec.exposed.conversions/ec.exposed.n,
        pC=ec.control.conversions/ec.control.n;
  const naive=pE/pC-1,infl=naive/cv.rel_lift;
  barChart(g('inflSvg'),[
    {label:L.barValid,bars:[{v:Math.log10(1+cv.rel_lift),color:TEAL,tag:pct(cv.rel_lift,0)}]},
    {label:L.barPost,bars:[{v:Math.log10(1+naive),color:PLUM,tag:pct(naive,0)}]}],
    {h:250,l:44,max:Math.log10(1+naive)*1.2,fmtY:v=>'10^'+v.toFixed(1),label:L.cH3exp});
  g('inflCap').textContent=L.inflCap(infl.toFixed(0));

  const lt={};M.c.late.forEach(r=>lt[r.outcome]=r);const P=lt.conversions;
  table(g('lateTable'),L.lateCap,L.lateTh,[
    [L.lateRows[0],pct(P.never_taker_rate,3)],
    [L.lateRows[1],pct(P.control_rate,3)],
    [L.lateRows[2],{t:pct(P.complier_baseline,3),cls:'hi'}],
    [L.lateRows[3],pct(P.exposed_rate,3)],
    [L.lateRows[4],{t:'+'+pct(P.late,3),cls:'ok'}]]);
  liftCalc();
  return {naive,infl,cv};
}

function liftCalc(){
  const L=t(),v=+g('liftR').value/100,share=v/(1+v);
  g('liftV').textContent=pct(v,0);
  g('incOut').textContent=pct(share,1);
  g('incOut2').textContent=Math.round(share*100);
}

function drawD(){
  if(!M.d)return;
  const L=t();g('d').hidden=false;
  const ss=M.d.sample_size,pk=M.d.peeking_false_positive_rate,
        dd=M.d.days_needed,asm=M.d.assumptions;
  const at5=k=>ss.find(r=>r.mde_relative===0.05&&r.baseline.startsWith(k));
  const c5=at5('CTR'),v5=at5('Conversion');
  const worst=pk[pk.length-1],best=pk[0];
  stats(g('dStats'),[
    [fmt(c5.n_per_arm),L.dS1],[fmt(v5.n_per_arm),L.dS2],
    [pct(best.fpr_ctr,1)+' → '+pct(worst.fpr_ctr,1),L.dS3(worst.looks)]]);

  const grp={};ss.forEach(r=>{(grp[r.baseline]=grp[r.baseline]||[]).push(r);});
  const cols={'CTR':PLUM,'Conversion':TEAL,'Visit':TEALS};
  lineChart(g('ssSvg'),Object.entries(grp).map(([nm,rs])=>{
    const key=Object.keys(cols).find(k=>nm.startsWith(k))||'CTR';
    return {pts:rs.slice().sort((a,b)=>a.mde_relative-b.mde_relative)
      .map(r=>[Math.log10(r.mde_relative*100),Math.log10(r.n_per_arm)]),
      color:cols[key],w:2.2};}),
    {h:260,ticksX:[0,0.5,1,1.5],fmtY:v=>'10^'+v.toFixed(1),label:L.ssCap});

  const rows=dd.filter(r=>String(r.rollout??r.rollout_share)==='3%'
    ||Number(r.rollout_share)===0.03);
  table(g('daysTable'),L.daysCap(fmt(asm.daily_eligible_users_assumed)),L.daysTh,
    (rows.length?rows:dd.slice(0,4)).map(r=>[
      r.mde??pct(r.mde_relative,0),Number(r.days_ctr).toFixed(1),
      {t:Number(r.days_conv).toFixed(1),cls:Number(r.days_conv)>60?'hi':''}]));

  lineChart(g('peekSvg'),[
    {pts:pk.map(r=>[r.looks,r.fpr_ctr]),color:PLUM,w:2.2},
    {pts:pk.map(r=>[r.looks,r.fpr_conv]),color:PLUMS,w:2.2},
    {pts:[[best.looks,asm.alpha],[worst.looks,asm.alpha]],color:MUTED,w:1,dash:'4 4'}],
    {h:250,ticksX:pk.map(r=>r.looks),fmtY:v=>pct(v,0),label:L.dPeekH3});
  g('peekCap').innerHTML=`<span style="color:${PLUM}">■</span>&nbsp;`+
    L.peekCap(pct(asm.alpha,0)).replace(' · ',` &nbsp;<span style="color:${PLUMS}">■</span>&nbsp;`)
    .replace(' · ',` &nbsp;<span style="color:${MUTED}">—</span>&nbsp;`);

  const ps=g('preSel');ps.replaceChildren();
  L.dcPresets.forEach(([v,lab])=>{const o=document.createElement('option');
    o.value=v;o.textContent=lab;ps.appendChild(o);});
  ssCalc();
}

function ssCalc(){
  const L=t();
  const p=Math.max(0.0001,(+g('baseN').value)/100);
  const mde=(+g('mdeR').value)/100;
  const daily=Math.max(1,+g('dailyN').value);
  const roll=(+g('rollR').value)/100;
  g('mdeV').textContent=pct(mde,0);
  g('rollV').textContent=pct(roll,0);
  const n=sampleSize(p,mde);
  g('ssOut').textContent=fmt(n);
  const perDay=daily*roll*0.5;
  const days=n/perDay;
  g('dayOut').textContent=days<1?'<1':(days<10?days.toFixed(1):fmt(days));
}

function drawRest(naive,infl,cv){
  const L=t(),pb=M.a.pooled_by_order;
  const p0=pb[0].ctr,p1=pb[pb.length-1].ctr;
  table(g('parTable'),null,L.parTh,[
    [L.parRows[0],L.parDataA(fmt(M.a.baselines.impressions)),
                  L.parDataC(fmt(cv.n_control+cv.n_treated))],
    [L.parRows[1],L.parVarA,L.parVarC],
    [L.parRows[2],L.parA[0],L.parC[0]],
    [L.parRows[3],L.parA[1]+' '+sig(p0)+' → '+sig(p1),
                  L.parC[1]+' '+pct(naive,0)],
    [L.parRows[4],L.parA[2],L.parC[2]+' '+pct(cv.rel_lift,1)],
    [L.parRows[5],L.parA[3],infl.toFixed(0)+L.parC[3]]]);
  const pop=M.b.population;
  g('limitList').innerHTML=L.lim.map(x=>'<li>'+(typeof x==='function'
    ? x(pct(M.a.baselines.pooled_ctr,2),pct(1-pop.observed_share_of_path_clicks,0),
        fmt(pop.attributed_conversions))
    : x)+'</li>').join('');
}

/* limits take different args; wrap individually */
function limitList(){
  const L=t(),pop=M.b.population;
  const args=[null,pct(M.a.baselines.pooled_ctr,2),
    pct(1-pop.observed_share_of_path_clicks,0),null,null,null,
    fmt(pop.attributed_conversions)];
  g('limitList').innerHTML=L.lim.map((x,i)=>'<li>'+
    (typeof x==='function'?x(args[i]):x)+'</li>').join('');
}

function applyStatic(){
  const L=t();
  document.documentElement.lang=LANG;
  document.title=L.docTitle;
  const md=g('metaDesc');if(md)md.setAttribute('content',L.metaDesc);
  document.body.className=(LANG==='ko'?'ko':'');
  document.querySelectorAll('[data-i]').forEach(n=>{
    const v=L[n.getAttribute('data-i')];
    if(typeof v==='string')n.textContent=v;});
  document.querySelectorAll('[data-i-label]').forEach(n=>{
    const v=L[n.getAttribute('data-i-label')];
    if(typeof v==='string')n.setAttribute('aria-label',v);});
  document.querySelectorAll('button[data-lang]').forEach(b=>
    b.setAttribute('aria-pressed',String(b.getAttribute('data-lang')===LANG)));
}

function renderAll(){
  applyStatic();
  heroDraw();drawA();drawB();
  const {naive,infl,cv}=drawC();
  drawD();
  drawRest(naive,infl,cv);
  limitList();
}

function boot(){
  const ws=[...new Set(M.b.rule_totals_by_window.map(r=>r.window_days))].sort((a,b)=>a-b);
  const wsel=g('winSel');
  ws.forEach(w=>{const o=document.createElement('option');o.value=w;
    o.textContent=w+(LANG==='ko'?'일':(' day'+(w>1?'s':'')));
    if(w===30)o.selected=true;wsel.appendChild(o);});
  const mcs=[...new Set(M.b.rank_agreement.map(r=>r.min_credit))].sort((a,b)=>a-b);
  const msel=g('mcSel');
  mcs.forEach(m=>{const o=document.createElement('option');o.value=m;
    o.textContent=String(m);if(m===200)o.selected=true;msel.appendChild(o);});

  document.querySelectorAll('input[name=hero]').forEach(r=>
    r.addEventListener('change',e=>{heroMode=e.target.value;heroDraw();}));
  wsel.addEventListener('change',drawRules);
  msel.addEventListener('change',drawRank);
  g('liftR').addEventListener('input',liftCalc);
  g('liftSnap').addEventListener('click',()=>{
    const cv=M.c.itt.find(r=>r.outcome==='conversions');
    g('liftR').value=Math.round(cv.rel_lift*100);liftCalc();});
  ['baseN','mdeR','dailyN','rollR'].forEach(i=>{
    const n=g(i);if(n)n.addEventListener('input',ssCalc);});
  const ps=g('preSel');
  if(ps)ps.addEventListener('change',()=>{g('baseN').value=ps.value;ssCalc();});
  document.querySelectorAll('button[data-lang]').forEach(b=>
    b.addEventListener('click',()=>{
      LANG=b.getAttribute('data-lang');
      const u=new URL(location.href);u.searchParams.set('lang',LANG);
      if(history.replaceState)history.replaceState(null,'',u);
      const opts=[...wsel.options];
      opts.forEach(o=>o.textContent=o.value+(LANG==='ko'?'일':(' day'+(+o.value>1?'s':''))));
      renderAll();}));

  renderAll();
}

load().then(boot).catch(e=>{
  applyStatic();
  console.error(e);
  g('err').style.display='block';
  g('errDetail').textContent=t().errDetail(e.message,location.protocol);
});
</script>
</body>
</html>

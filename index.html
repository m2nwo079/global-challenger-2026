<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What the logs cannot tell you</title>
<meta name="description" id="metaDesc" content="Three measurements on public Criteo advertising logs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17181A; --paper:#EFEDE6; --card:#F8F7F3; --card2:#FCFBF8;
  --rule:#CBC7BA; --rule-soft:#DEDBD0; --muted:#6A685F;
  --plum:#7A2246; --plum-soft:#C68DA5; --plum-wash:#F3E4EA;
  --teal:#0F5F55; --teal-soft:#7FB3A9;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --serif:'Source Serif 4',Georgia,serif;
  --disp:'IBM Plex Mono',ui-monospace,monospace;
}
body.ko{
  --serif:'Noto Serif KR','Source Serif 4',Georgia,serif;
  --disp:'IBM Plex Mono','IBM Plex Sans KR',sans-serif;
  --mono:'IBM Plex Mono','IBM Plex Sans KR',monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--serif);font-size:17.5px;line-height:1.68;
  font-variant-numeric:tabular-nums}
body.ko{line-height:1.82;font-size:16.5px}
.wrap{max-width:1080px;margin:0 auto;padding:0 28px}
a{color:var(--plum);text-underline-offset:3px;text-decoration-thickness:1px}
a:hover{background:var(--plum-wash)}
:focus-visible{outline:2.5px solid var(--plum);outline-offset:3px}

h1,h2,h3,h4{font-family:var(--disp)}
.eyebrow,.num,.label,table,.legend,.marker,figcaption,.ctl,.hint,.pill{font-family:var(--mono)}
h1{font-size:clamp(30px,5vw,56px);font-weight:500;line-height:1.06;letter-spacing:-.03em;margin:0 0 18px;max-width:20ch}
body.ko h1{font-weight:600;letter-spacing:-.02em;line-height:1.24;max-width:17ch}
h2{font-size:clamp(22px,2.7vw,28px);font-weight:500;letter-spacing:-.02em;margin:0 0 8px}
body.ko h2{font-weight:600;letter-spacing:-.01em}
h3{font-size:16px;font-weight:500;letter-spacing:.01em;margin:38px 0 10px}
h4{font-size:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
body.ko h4{letter-spacing:.02em;text-transform:none;font-size:13.5px}
p{margin:0 0 17px;max-width:66ch}
body.ko p{max-width:45ch}
.lede{font-size:clamp(18px,2.1vw,21px);line-height:1.56;max-width:52ch}
body.ko .lede{line-height:1.72;max-width:37ch}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;display:block}
body.ko .eyebrow{letter-spacing:.06em;text-transform:none;font-size:12px}
.small{font-size:14.5px;color:var(--muted);line-height:1.6;max-width:60ch}
body.ko .small{max-width:43ch;line-height:1.75}
.mono{font-family:var(--mono)}

/* ============ header ============ */
header{padding:44px 0 0}
.masthead{display:flex;justify-content:space-between;align-items:center;gap:18px;
  flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:16px;margin-bottom:46px}
.masthead .mid{display:flex;gap:12px;flex-wrap:wrap}
.masthead>span{font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted)}

/* ============ segmented controls ============ */
.seg{display:inline-flex;border:1.5px solid var(--ink);background:var(--card2);
  border-radius:2px;overflow:hidden}
.seg button,.seg label{font-family:var(--mono);font-size:13px;font-weight:500;
  letter-spacing:.02em;padding:10px 16px;background:transparent;color:var(--ink);
  border:0;border-right:1.5px solid var(--ink);cursor:pointer;
  user-select:none;line-height:1.2;transition:background .13s ease,color .13s ease}
.seg button:last-child,.seg label:last-child{border-right:0}
.seg button:hover,.seg label:hover{background:var(--plum-wash)}
.seg button[aria-pressed=true],.seg label:has(input:checked){
  background:var(--ink);color:var(--paper)}
.seg button[aria-pressed=true]:hover,.seg label:has(input:checked):hover{background:var(--ink)}
.seg input{position:absolute;opacity:0;width:0;height:0}
.seg.small button{font-size:11.5px;padding:7px 12px}

/* interactivity cue */
.pill{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--plum);margin:0 0 12px}
body.ko .pill{letter-spacing:.04em;text-transform:none;font-size:11.5px}
.pill::before{content:'';width:8px;height:8px;background:var(--plum);
  transform:rotate(45deg);display:inline-block}
.hint{font-size:11.5px;color:var(--plum);margin:10px 0 0}

/* ============ hero ============ */
.heroChart{margin:32px 0 0;background:var(--card);
  border:1px solid var(--rule-soft);border-left:4px solid var(--plum);
  border-radius:0;padding:24px 22px 16px}
.readoutBox{display:grid;margin:20px 0 0}
.readoutBox>p{grid-area:1/1;margin:0;font-family:var(--serif);
  font-size:clamp(17px,2.1vw,20px);line-height:1.5;max-width:60ch}
body.ko .readoutBox>p{line-height:1.74;max-width:43ch}
.readoutBox>p[data-off]{visibility:hidden}
.readoutBox b{font-family:var(--mono);font-weight:600;font-size:.94em}
.legend{display:flex;gap:22px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:16px 0 0}
.legend i{display:inline-block;width:16px;height:3px;vertical-align:3px;margin-right:7px}

/* ============ sections ============ */
section{padding:66px 0;border-top:1px solid var(--rule)}
#about{border-top:0;padding-top:8px}
.marker{font-size:12.5px;letter-spacing:.03em;color:var(--plum);margin:0 0 12px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:46px;align-items:start}
.cols.rev{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.cols.even{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:34px}

figure{margin:0;background:var(--card);border:1px solid var(--rule-soft);padding:20px 18px 12px}
figure.live{border-left:4px solid var(--plum)}
figcaption{font-size:12px;color:var(--muted);line-height:1.62;padding:12px 2px 4px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
caption{text-align:left;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);padding-bottom:11px}
body.ko caption{letter-spacing:.03em;text-transform:none;font-size:12px}
th,td{text-align:right;padding:8px 9px;border-bottom:1px solid var(--rule-soft)}
th:first-child,td:first-child{text-align:left}
thead th{font-weight:600;border-bottom:1.5px solid var(--ink);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.hi{color:var(--plum);font-weight:500} td.ok{color:var(--teal);font-weight:500}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:1px;
  background:var(--rule-soft);border:1px solid var(--rule-soft);margin:28px 0 0}
.stat{background:var(--card);padding:17px 16px}
.stat .num{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.12}
.stat .label{display:block;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);margin-top:8px;line-height:1.52}
body.ko .stat .label{letter-spacing:0;text-transform:none;font-size:12px}

/* ============ interactive panel ============ */
.panel{background:var(--card);border:1px solid var(--rule-soft);
  border-left:4px solid var(--plum);padding:22px 20px}
.field{margin-bottom:22px}
.field:last-of-type{margin-bottom:0}
.field>label{display:block;font-family:var(--mono);font-size:12.5px;font-weight:500;
  letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
body.ko .field>label{letter-spacing:.01em;text-transform:none;font-size:13px}
.field .val{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--plum);
  float:right;letter-spacing:0;text-transform:none}
.ctl{font-size:15px;padding:11px 13px;border:1.5px solid var(--ink);
  background:var(--card2);color:var(--ink);cursor:pointer;min-width:130px;
  border-radius:2px;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:calc(100% - 17px) calc(50% + 1px),calc(100% - 12px) calc(50% + 1px);
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
.ctl:hover{background-color:var(--plum-wash)}
input.ctl{cursor:text;background-image:none;padding-right:13px;min-width:0;width:130px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;
  height:26px;background:transparent;cursor:pointer;margin:2px 0 0}
input[type=range]::-webkit-slider-runnable-track{height:8px;background:var(--rule);border:1px solid var(--rule)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:24px;height:24px;background:var(--plum);border:2px solid var(--paper);
  border-radius:50%;margin-top:-9px;box-shadow:0 0 0 1.5px var(--plum)}
input[type=range]::-moz-range-track{height:8px;background:var(--rule);border:1px solid var(--rule)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;background:var(--plum);
  border:2px solid var(--paper);border-radius:50%;box-shadow:0 0 0 1.5px var(--plum)}
.btn{font-family:var(--mono);font-size:13px;font-weight:500;padding:9px 14px;
  border:1.5px solid var(--ink);background:var(--card2);color:var(--ink);
  cursor:pointer;border-radius:2px;margin-top:12px}
.btn:hover{background:var(--plum-wash)}
.out{border-top:1.5px solid var(--ink);margin-top:22px;padding-top:18px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:18px}
.out .ov{display:block;font-family:var(--mono);font-size:27px;font-weight:600;
  letter-spacing:-.02em;line-height:1.12;color:var(--plum)}
.out .ol{display:block;font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--muted);margin-top:7px;line-height:1.5}
body.ko .out .ol{letter-spacing:0;text-transform:none;font-size:12px}

/* ============ parallel / lists ============ */
.parallel td{vertical-align:top;text-align:left;line-height:1.58}
.parallel th{text-align:left}
.parallel th:nth-child(2){color:var(--plum)}
.parallel th:nth-child(3){color:var(--teal)}
.parallel td:first-child{color:var(--muted);width:23%;font-size:12px}
ul,ol{padding-left:22px;max-width:64ch}
body.ko ul,body.ko ol{max-width:46ch}
li{margin-bottom:11px}
.apply{list-style:none;padding:0;max-width:none}
.apply li{display:grid;grid-template-columns:76px minmax(0,1fr);gap:18px;
  padding:17px 0;border-top:1px solid var(--rule-soft);margin:0;align-items:start}
.apply li:first-child{border-top:1.5px solid var(--ink)}
.apply .tag{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--plum);padding-top:3px}
.apply .body{max-width:60ch}
body.ko .apply .body{max-width:46ch}
.repro{font-family:var(--mono);font-size:13px;line-height:2;color:var(--muted)}
.repro b{color:var(--ink);font-weight:500}

footer{padding:52px 0 84px;border-top:1px solid var(--rule);color:var(--muted);font-size:14.5px}
footer p{max-width:64ch}
#err{display:none;margin:36px 0;padding:22px;border:1.5px solid var(--plum);
  background:var(--card);font-size:15.5px}
#err code{font-family:var(--mono);font-size:13.5px;background:var(--paper);padding:3px 6px}

@media(max-width:860px){
  .cols,.cols.rev{grid-template-columns:1fr;gap:28px}
  .wrap{padding:0 20px}
  header{padding-top:28px}
  section{padding:46px 0}
  .masthead>span:last-child{display:none}
  .apply li{grid-template-columns:1fr;gap:8px}
  body.ko p,body.ko .small,body.ko .lede,body.ko ul,body.ko ol,
  body.ko .readoutBox>p,body.ko .apply .body{max-width:none}
}
@media(prefers-reduced-motion:no-preference){
  .ln{transition:stroke-width .22s ease,opacity .22s ease}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="masthead">
      <span data-i="mastLeft"></span>
      <div class="mid">
        <div class="seg" role="group" data-i-label="langAria">
          <button type="button" data-lang="en" aria-pressed="true">English</button>
          <button type="button" data-lang="ko" aria-pressed="false">한국어</button>
        </div>
        <div class="seg" role="group" data-i-label="lvlAria">
          <button type="button" data-lvl="e" aria-pressed="false" data-i="lvlEasy"></button>
          <button type="button" data-lvl="t" aria-pressed="true" data-i="lvlPro"></button>
        </div>
      </div>
      <span data-i="mastRight"></span>
    </div>

    <span class="eyebrow" data-i="heroEyebrow"></span>
    <h1 data-i="heroH1"></h1>
    <p class="lede" data-i="heroLede"></p>

    <div class="heroChart">
      <p class="pill" data-i="pillTry"></p>
      <div class="seg" role="radiogroup" data-i-label="heroTogAria" style="margin-bottom:20px">
        <label><input type="radio" name="hero" value="pooled" checked><span data-i="togPooled"></span></label>
        <label><input type="radio" name="hero" value="cohort"><span data-i="togCohort"></span></label>
      </div>
      <div id="heroSvg" aria-live="polite"></div>
      <div class="legend">
        <span><i style="background:var(--plum)"></i><span data-i="legPooled"></span></span>
        <span><i style="background:var(--teal)"></i><span data-i="legCohort"></span></span>
      </div>
      <div class="readoutBox">
        <p id="roPooled"></p>
        <p id="roCohort" data-off></p>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <div id="err">
    <strong data-i="errTitle"></strong>
    <p style="margin:10px 0 0" data-i="errP1"></p>
    <p style="margin:10px 0 0" data-i="errP2"></p>
    <p style="margin:10px 0 0"><code>python3 -m http.server</code> &nbsp;·&nbsp; <code>http://localhost:8000</code></p>
    <p style="margin:14px 0 0" class="small" id="errDetail"></p>
  </div>
</div>

<main class="wrap">

<section id="about">
  <div class="cols">
    <div>
      <h4 data-i="abH4"></h4>
      <p data-i="abP1"></p>
      <p data-i="abP2"></p>
      <p data-i="abP3"></p>
    </div>
    <div>
      <h4 data-i="reproH4"></h4>
      <p class="repro" data-i="reproList"></p>
      <p class="small" style="margin-top:18px" data-i="reproNote"></p>
      <h4 style="margin-top:30px" data-i="findH4"></h4>
      <ol id="findList"></ol>
    </div>
  </div>
</section>

<section id="a">
  <p class="marker" data-i="aMarker"></p>
  <h2 data-i="aH2"></h2>
  <div class="cols">
    <div>
      <p data-i="aP1"></p>
      <p data-i="aP2"></p>
      <p data-i="aP3"></p>
      <div class="stats" id="aStats"></div>
    </div>
    <div>
      <figure>
        <div id="hazardSvg"></div>
        <figcaption id="hazardCap"></figcaption>
      </figure>
      <h3 data-i="aH3alpha"></h3>
      <div style="overflow-x:auto"><table id="alphaTable"></table></div>
      <p class="small" style="margin-top:16px" data-i="aAlphaNote"></p>
    </div>
  </div>
</section>

<section id="b">
  <p class="marker" data-i="bMarker"></p>
  <h2 data-i="bH2"></h2>
  <div class="cols rev">
    <div>
      <figure class="live">
        <p class="pill" data-i="pillPick"></p>
        <div class="field">
          <label for="winSel" data-i="bWinLabel"></label>
          <select id="winSel" class="ctl"></select>
        </div>
        <div id="ruleSvg" style="margin-top:20px"></div>
        <figcaption id="ruleCap"></figcaption>
      </figure>
    </div>
    <div>
      <p data-i="bP1"></p>
      <p data-i="bP2"></p>
      <p data-i="bP3"></p>
      <div class="stats" id="bStats"></div>
    </div>
  </div>

  <h3 data-i="bH3rank"></h3>
  <div class="cols">
    <div>
      <p data-i="bRankP1"></p>
      <p data-i="bRankP2"></p>
      <p data-i="bRankP3"></p>
    </div>
    <div>
      <div class="panel">
        <p class="pill" data-i="pillPick"></p>
        <div class="field">
          <label for="mcSel" data-i="bMinLabel"></label>
          <select id="mcSel" class="ctl"></select>
        </div>
        <div style="overflow-x:auto;margin-top:20px"><table id="rankTable"></table></div>
        <p class="small" style="margin-top:14px" id="rankNote"></p>
      </div>
    </div>
  </div>
</section>

<section id="c">
  <p class="marker" data-i="cMarker"></p>
  <h2 data-i="cH2"></h2>
  <div class="cols">
    <div>
      <p data-i="cP1"></p>
      <p class="small" id="cRepro"></p>
      <p data-i="cP2"></p>
      <div class="stats" id="cStats"></div>
    </div>
    <div>
      <figure>
        <div id="shareSvg"></div>
        <figcaption id="shareCap"></figcaption>
      </figure>
    </div>
  </div>

  <h3 data-i="cCalcH3"></h3>
  <div class="cols rev">
    <div>
      <div class="panel">
        <p class="pill" data-i="pillDrag"></p>
        <div class="field">
          <label for="liftR"><span data-i="cCalcLabel"></span><span class="val" id="liftV"></span></label>
          <input type="range" id="liftR" min="0" max="200" step="1" value="59">
          <button type="button" class="btn" id="liftSnap" data-i="cCalcSnap"></button>
        </div>
        <div class="out">
          <div><span class="ov" id="incOut"></span><span class="ol" data-i="cOut1"></span></div>
          <div><span class="ov" id="incOut2"></span><span class="ol" data-i="cOut2"></span></div>
        </div>
      </div>
    </div>
    <div>
      <p data-i="cCalcP1"></p>
      <p data-i="cCalcP2"></p>
      <p class="small" data-i="cCalcNote"></p>
    </div>
  </div>

  <h3 data-i="cH3exp"></h3>
  <div class="cols rev">
    <div>
      <figure>
        <div id="inflSvg"></div>
        <figcaption id="inflCap"></figcaption>
      </figure>
    </div>
    <div>
      <p data-i="cExpP1"></p>
      <p data-i="cExpP2"></p>
      <div style="overflow-x:auto;margin:20px 0 0"><table id="lateTable"></table></div>
      <p class="small" style="margin-top:16px" data-i="cExpNote"></p>
    </div>
  </div>
</section>

<section id="d" hidden>
  <p class="marker" data-i="dMarker"></p>
  <h2 data-i="dH2"></h2>
  <div class="cols">
    <div>
      <p data-i="dP1"></p>
      <p data-i="dP2"></p>
      <div class="stats" id="dStats"></div>
      <p class="small" style="margin-top:26px" data-i="dNote"></p>
    </div>
    <div>
      <figure>
        <div id="ssSvg"></div>
        <figcaption data-i="ssCap"></figcaption>
      </figure>
      <h3 data-i="dDaysH3"></h3>
      <div style="overflow-x:auto"><table id="daysTable"></table></div>
    </div>
  </div>

  <h3 data-i="dCalcH3"></h3>
  <div class="cols">
    <div>
      <p data-i="dCalcP1"></p>
      <p data-i="dCalcP2"></p>
    </div>
    <div>
      <div class="panel">
        <p class="pill" data-i="pillCalc"></p>
        <div class="field">
          <label for="preSel" data-i="dcPreset"></label>
          <select id="preSel" class="ctl"></select>
        </div>
        <div class="field">
          <label for="baseN" data-i="dcBase"></label>
          <input type="number" id="baseN" class="ctl" step="0.01" min="0.01" max="99" value="0.30">
          <span class="mono" style="font-size:15px;margin-left:6px">%</span>
        </div>
        <div class="field">
          <label for="mdeR"><span data-i="dcMde"></span><span class="val" id="mdeV"></span></label>
          <input type="range" id="mdeR" min="1" max="50" step="1" value="5">
        </div>
        <div class="field">
          <label for="dailyN" data-i="dcDaily"></label>
          <input type="number" id="dailyN" class="ctl" step="10000" min="1000" value="1000000" style="width:170px">
        </div>

 abH4:'What this is',
 abP1:{t:'An interview with a practitioner in the advertising division of a major Korean messaging platform produced a set of operational judgments that were described qualitatively and never quantified: where user fatigue starts to conflict with revenue, how attribution windows get chosen, how a new placement is rolled out to a small share of users first.',
       e:'We interviewed someone who works in the advertising team of a large Korean messaging app. They described how decisions get made — when showing more ads starts to annoy people, how long they wait before counting a sale, how a new ad slot is tested on a small group first. None of it came with numbers.'},
 abP2:{t:'This project fills those gaps with public data instead. Two datasets released by Criteo AI Lab — 16.5 million ad impressions and a 14 million user randomised holdout — are used to measure three quantities that advertising operations rely on, plus the cost of running the experiment that would settle them.',
       e:'This project puts numbers on those gaps using data anyone can download. Criteo, an ad company, published two files: 16.5 million records of ads being shown, and a study where 14 million people were randomly split so some were kept away from the ads. We use them to measure three things ad teams rely on, and what it would cost to test them properly.'},
 abP3:{t:'The three measurements land on the same finding, which is what makes the project worth reading rather than three separate charts: the answer you get is decided by which group you compare, and picking that group using something that happened after the ad was served breaks the analysis every time.',
       e:'All three measurements point to the same lesson, which is why they belong on one page: the answer you get depends on which group you choose to compare. And if you choose that group based on something that happened after the ad was shown, the answer is wrong — every time.'},

  {tag:'C',t:'Treat last-click totals as an upper bound. Roughly three fifths of them would have occurred without the advertising, and the only way to know your own share is a randomised holdout.',
        e:'Treat the sales figure in an ad report as a ceiling, not a fact. About three fifths would have happened anyway. The only way to learn your own share is to hold a group back.'},
  {tag:'C',t:'Never restrict an effect estimate to users who were exposed. It is the single most expensive mistake available here, worth a factor of 45, and it feels like the careful thing to do.',
        e:'Never measure an ad\u2019s effect by looking only at people who saw it. It feels like the careful choice and it is the most expensive mistake on this page, worth a factor of 45.'},
  {tag:'D',t:'Judge small rollouts on click-level metrics and defer conversion judgements. At a 3% rollout a 5% click change resolves within a day; the same change in conversions takes months.',
        e:'When testing on a small group, judge it on clicks and wait before judging sales. At a 3% test, a 5% change in clicks is clear within a day. The same change in sales takes months.'},
  {tag:'D',t:'Set the sample size in advance and check once. Daily peeking over three weeks takes the false positive rate from 5% to about 24%.',
        e:'Decide how many people you need before you start, then check once. Peeking every day for three weeks raises your chance of a false alarm from 5% to about 24%.'}],

 rulesP1:{t:'Impression order is counted per user–campaign pair. Time to conversion is the conversion timestamp minus the impression timestamp, applied only to converting rows. Conversions are deduplicated by conversion id. The CTR denominator is impressions. A value of −1 marks a missing field and is filtered out of every mean, extremum, and time difference. Days are the floor of seconds over 86,400.',
          e:'Ad order is counted separately for each person and each campaign. Time to a sale is the sale time minus the ad time, used only on rows that had a sale. Each sale is counted once even when it appears on several rows. Click rate is clicks divided by ad views. A −1 means the field is empty and is removed from every average and time difference.'},

          e:'The credit rules are not our invention. They come from the code the data\u2019s authors published alongside it.'},

 abH4:'이 페이지는 무엇인가',
 abP1:{t:'국내 대형 메신저 플랫폼 광고 부문 실무자 인터뷰에서, 정성적으로만 설명되고 수치가 붙지 않은 판단들이 확인되었다. 사용자 피로가 어디서부터 수익과 충돌하는지, 어트리뷰션 기간을 어떻게 정하는지, 새 지면을 왜 소수 사용자부터 여는지가 그것이다.',
       e:'국내 대형 메신저 앱의 광고 팀에서 일하는 분을 인터뷰했다. 광고를 얼마나 자주 보여주면 사람들이 불편해지는지, 구매를 며칠까지 광고 성과로 셀지, 새 광고 자리를 왜 소수에게만 먼저 열어 보는지를 설명해 주었다. 다만 숫자는 없었다.'},
 abP2:{t:'이 프로젝트는 그 빈칸을 공개 데이터로 채운다. Criteo AI Lab이 공개한 두 데이터셋, 즉 1,650만 건의 광고 노출 기록과 1,400만 명 규모의 무작위 홀드아웃 실험으로 광고 운영이 의존하는 세 가지 값을 측정하고, 그 값을 확정하려면 실험에 무엇이 드는지까지 계산한다.',
       e:'이 프로젝트는 그 빈칸을 누구나 내려받을 수 있는 데이터로 채운다. 광고 회사 Criteo가 공개한 파일 두 개를 쓴다. 하나는 광고가 노출된 기록 1,650만 건, 다른 하나는 1,400만 명을 무작위로 나눠 일부에게는 광고를 아예 보여주지 않은 실험이다. 이걸로 광고 팀이 기대는 세 가지를 재고, 제대로 검증하려면 무엇이 드는지도 계산한다.'},
 abP3:{t:'세 측정이 같은 결론에 도달한다는 점이 이 프로젝트를 세 개의 별도 차트가 아니게 만든다. 어떤 집단을 비교하는지가 답을 결정하며, 광고가 나간 뒤에 결정되는 것으로 그 집단을 고르면 분석은 매번 무너진다.',
       e:'세 측정이 모두 같은 교훈에 도달한다. 그래서 한 페이지에 있어야 한다. 어떤 집단을 골라 비교하느냐가 답을 결정한다. 그리고 광고가 나간 뒤에 벌어진 일로 그 집단을 고르면, 답은 매번 틀린다.'},

      e:'한 번 방문한 쇼핑몰 광고가 따라다니는 방식이다. 사람이 계속 반응하는 동안 시스템은 돈을 들여 광고를 계속 보여준다. 그래서 광고를 20번 본 사람은 그 내내 반응하고 있었다는 뜻이다. 20이라는 숫자는 누가 미리 정한 설정이 아니라 그 사람이 어떻게 행동했는지의 결과다.'},

const NS='http://www.w3.org/2000/svg';
const PLUM='#7A2246',PLUMS='#C68DA5',TEAL='#0F5F55',TEALS='#7FB3A9',
      INK='#17181A',MUTED='#6A685F',RULE='#DEDBD0',GREY='#DDD9CC';
const el=(tg,a={})=>{const n=document.createElementNS(NS,tg);
  for(const k in a)n.setAttribute(k,a[k]);return n;};
const tx=(s,a={})=>{const n=el('text',Object.assign({fill:MUTED,
  'font-family':"'IBM Plex Mono','IBM Plex Sans KR',monospace",'font-size':'11'},a));
  n.textContent=s;return n;};
const pct=(v,d=1)=>(v*100).toFixed(d)+'%';

const sv=(w,h,l)=>el('svg',{viewBox:`0 0 ${w} ${h}`,width:'100%',role:'img',
  'aria-label':l||'chart',style:'display:block;overflow:visible'});
const g=i=>document.getElementById(i);

function lineChart(host,series,o){
  const W=560,H=o.h||300,P={t:14,r:16,b:36,l:50};
  const xs=series.flatMap(s=>s.pts.map(p=>p[0])),
        ys=series.flatMap(s=>s.pts.map(p=>p[1]));
  const x0=o.xMin??Math.min(...xs),x1=o.xMax??Math.max(...xs);
  let y0=o.yMin??Math.min(...ys),y1=o.yMax??Math.max(...ys);
  const pd=(y1-y0)*0.08;y0-=pd;y1+=pd;
  const X=v=>P.l+(v-x0)/(x1-x0)*(W-P.l-P.r);
  const Y=v=>H-P.b-(v-y0)/(y1-y0)*(H-P.t-P.b);
  const s=sv(W,H,o.label);
  for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4;
    s.appendChild(el('line',{x1:P.l,x2:W-P.r,y1:Y(v),y2:Y(v),stroke:RULE}));
    s.appendChild(tx(o.fmtY?o.fmtY(v):v.toFixed(2),{x:P.l-9,y:Y(v)+4,'text-anchor':'end'}));}
  (o.ticksX||[]).forEach(v=>s.appendChild(tx(String(v),{x:X(v),y:H-P.b+19,'text-anchor':'middle'})));
  s.appendChild(el('line',{x1:P.l,x2:W-P.r,y1:H-P.b,y2:H-P.b,stroke:INK,'stroke-width':1.2}));
  series.forEach(sr=>{
    const d=sr.pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
    s.appendChild(el('path',{d,fill:'none',stroke:sr.color,'stroke-width':sr.w||2.2,
      'stroke-linejoin':'round','stroke-linecap':'round',opacity:sr.op??1,
      'stroke-dasharray':sr.dash||'',class:'ln'}));});
  host.replaceChildren(s);
}

function barChart(host,groups,o){
  const W=560,H=o.h||280,P={t:18,r:14,b:52,l:o.l??54};
  const max=o.max??Math.max(...groups.flatMap(x=>x.bars.map(b=>b.v)));
  const s=sv(W,H,o.label),gw=(W-P.l-P.r)/groups.length;
  const Y=v=>H-P.b-(v/max)*(H-P.t-P.b);
  for(let i=0;i<=4;i++){const v=max*i/4;
    s.appendChild(el('line',{x1:P.l,x2:W-P.r,y1:Y(v),y2:Y(v),stroke:RULE}));
    s.appendChild(tx(o.fmtY?o.fmtY(v):String(Math.round(v)),{x:P.l-9,y:Y(v)+4,'text-anchor':'end'}));}
  groups.forEach((gr,gi)=>{
    const n=gr.bars.length,bw=Math.min(50,(gw-18)/n),
          st=P.l+gi*gw+(gw-bw*n-(n-1)*6)/2;
    gr.bars.forEach((b,bi)=>{const x=st+bi*(bw+6);
      s.appendChild(el('rect',{x,y:Y(b.v),width:bw,height:Math.max(0,H-P.b-Y(b.v)),fill:b.color}));
      if(b.tag)s.appendChild(tx(b.tag,{x:x+bw/2,y:Y(b.v)-7,'text-anchor':'middle',
        fill:b.color,'font-size':'11.5'}));});
    String(gr.label).split('\n').forEach((ln,li)=>
      s.appendChild(tx(ln,{x:P.l+gi*gw+gw/2,y:H-P.b+19+li*14,'text-anchor':'middle'})));});
  host.replaceChildren(s);
}

function stackChart(host,items,o){
  const W=560,H=o.h||280,P={t:18,r:14,b:44,l:52};
  const s=sv(W,H,o.label),gw=(W-P.l-P.r)/items.length;
  const Y=v=>H-P.b-v*(H-P.t-P.b);
  for(let i=0;i<=4;i++){const v=i/4;
    s.appendChild(el('line',{x1:P.l,x2:W-P.r,y1:Y(v),y2:Y(v),stroke:RULE}));
    s.appendChild(tx(pct(v,0),{x:P.l-9,y:Y(v)+4,'text-anchor':'end'}));}
  items.forEach((it,i)=>{
    const bw=Math.min(78,gw-40),x=P.l+i*gw+(gw-bw)/2;
    s.appendChild(el('rect',{x,y:Y(1),width:bw,height:(H-P.b)-Y(1),fill:GREY}));
    s.appendChild(el('rect',{x,y:Y(it.share),width:bw,
      height:Math.max(0,(H-P.b)-Y(it.share)),fill:TEAL}));
    s.appendChild(tx(pct(it.share),{x:x+bw/2,y:Y(it.share)-8,'text-anchor':'middle',
      fill:TEAL,'font-size':'12'}));
    s.appendChild(tx(it.label,{x:P.l+i*gw+gw/2,y:H-P.b+19,'text-anchor':'middle'}));});
  host.replaceChildren(s);
}

function table(host,cap,head,rows){
  host.replaceChildren();
  if(cap){const c=document.createElement('caption');c.textContent=cap;host.appendChild(c);}
  const th=document.createElement('thead'),tr=document.createElement('tr');
  head.forEach(h=>{const e=document.createElement('th');e.textContent=h;tr.appendChild(e);});
  th.appendChild(tr);host.appendChild(th);
  const tb=document.createElement('tbody');
  rows.forEach(r=>{const row=document.createElement('tr');
    r.forEach(c=>{const e=document.createElement('td');
      if(c&&typeof c==='object'){e.textContent=c.t;if(c.cls)e.className=c.cls;}
      else e.textContent=c;row.appendChild(e);});
    tb.appendChild(row);});
  host.appendChild(tb);
}
const stats=(host,arr)=>{host.innerHTML=arr.map(([n,l])=>
  `<div class="stat"><span class="num">${n}</span><span class="label">${l}</span></div>`).join('');};

const files={a:'output/module_a.json',b:'output/module_b.json',
             c:'output/module_c.json',d:'output/module_d.json'};

async function load(){
  for(const k of ['a','b','c']){
    let r;
    try{r=await fetch(files[k]);}catch(e){throw new Error('request for '+files[k]+' was blocked');}
    if(!r.ok)throw new Error(files[k]+' returned HTTP '+r.status);
    try{M[k]=await r.json();}catch(e){throw new Error(files[k]+' is not valid JSON');}
  }
  try{const r=await fetch(files.d);if(r.ok)M.d=await r.json();}catch(e){}
}

const Z_A=1.959963985,Z_B=0.841621234;
const sampleSize=(p,mde)=>{
  const p2=p*(1+mde),pb=(p+p2)/2;
  return Math.pow(Z_A*Math.sqrt(2*pb*(1-pb))+Z_B*Math.sqrt(p*(1-p)+p2*(1-p2)),2)
       / Math.pow(p2-p,2);};

function drawD(){
  if(!M.d)return;
  g('d').hidden=false;
  const ss=M.d.sample_size,pk=M.d.peeking_false_positive_rate,
        dd=M.d.days_needed,asm=M.d.assumptions;
  const at5=k=>ss.find(r=>r.mde_relative===0.05&&r.baseline.startsWith(k));
  const c5=at5('CTR'),v5=at5('Conversion'),w=pk[pk.length-1],b=pk[0];
  stats(g('dStats'),[[fmt(c5.n_per_arm),K('dS1')],[fmt(v5.n_per_arm),K('dS2')],
    [pct(b.fpr_ctr,1)+' → '+pct(w.fpr_ctr,1),K('dS3')(w.looks)]]);
  const grp={};ss.forEach(r=>{(grp[r.baseline]=grp[r.baseline]||[]).push(r);});
  const cols={'CTR':PLUM,'Conversion':TEAL,'Visit':TEALS};
  lineChart(g('ssSvg'),Object.entries(grp).map(([nm,rs])=>{
    const key=Object.keys(cols).find(k=>nm.startsWith(k))||'CTR';
    return {pts:rs.slice().sort((a,b)=>a.mde_relative-b.mde_relative)
      .map(r=>[Math.log10(r.mde_relative*100),Math.log10(r.n_per_arm)]),color:cols[key]};}),
    {h:265,ticksX:[0,0.5,1,1.5],fmtY:v=>'10^'+v.toFixed(1),label:K('ssCap')});
  const rows=dd.filter(r=>String(r.rollout??r.rollout_share)==='3%'||Number(r.rollout_share)===0.03);
  table(g('daysTable'),K('daysCap')(fmt(asm.daily_eligible_users_assumed)),K('daysTh'),
    (rows.length?rows:dd.slice(0,4)).map(r=>[r.mde??pct(r.mde_relative,0),
      Number(r.days_ctr).toFixed(1),
      {t:Number(r.days_conv).toFixed(1),cls:Number(r.days_conv)>60?'hi':''}]));
  lineChart(g('peekSvg'),[
    {pts:pk.map(r=>[r.looks,r.fpr_ctr]),color:PLUM},
    {pts:pk.map(r=>[r.looks,r.fpr_conv]),color:PLUMS},
    {pts:[[b.looks,asm.alpha],[w.looks,asm.alpha]],color:MUTED,w:1.2,dash:'5 4'}],
    {h:255,ticksX:pk.map(r=>r.looks),fmtY:v=>pct(v,0),label:K('dPeekH3')});
  const parts=K('peekCap')(pct(asm.alpha,0)).split(' · ');
  g('peekCap').innerHTML=`<span style="color:${PLUM}">■</span> ${parts[0]}`+
    (parts[1]?` &nbsp;<span style="color:${PLUMS}">■</span> ${parts[1]}`:'')+
    (parts[2]?` &nbsp;<span style="color:${MUTED}">—</span> ${parts[2]}`:'');
  const ps=g('preSel');ps.replaceChildren();
  K('dcPresets').forEach(([v,lab])=>{const o=document.createElement('option');
    o.value=v;o.textContent=lab;ps.appendChild(o);});
  ssCalc();
}
function ssCalc(){
  const p=Math.max(0.0001,(+g('baseN').value)/100),
        mde=(+g('mdeR').value)/100,
        daily=Math.max(1,+g('dailyN').value),
        roll=(+g('rollR').value)/100;
  g('mdeV').textContent=pct(mde,0);
  g('rollV').textContent=pct(roll,0);
  const n=sampleSize(p,mde),days=n/(daily*roll*0.5);
  g('ssOut').textContent=fmt(n);
  g('dayOut').textContent=days<1?'<1':(days<10?days.toFixed(1):fmt(days));
}

function drawTail(naive,infl,cv){
  const pb=M.a.pooled_by_order,p0=pb[0].ctr,p1=pb[pb.length-1].ctr;
  const PR=K('parRows'),PA=K('parA'),PC=K('parC');
  table(g('parTable'),null,K('parTh'),[
    [PR[0],K('parDataA')(fmt(M.a.baselines.impressions)),
           K('parDataC')(fmt(cv.n_control+cv.n_treated))],
    [PR[1],K('parVarA'),K('parVarC')],
    [PR[2],PA[0],PC[0]],
    [PR[3],PA[1]+' '+sig(p0)+' → '+sig(p1),PC[1]+' '+pct(naive,0)],
    [PR[4],PA[2],PC[2]+' '+pct(cv.rel_lift,1)],
    [PR[5],PA[3],infl.toFixed(0)+PC[3]]]);
  const pop=M.b.population;
  const args=[null,pct(M.a.baselines.pooled_ctr,2),
    pct(1-pop.observed_share_of_path_clicks,0),null,null,null,
    fmt(pop.attributed_conversions)];
  g('limitList').innerHTML=T[LANG].lim.map((x,i)=>{const v=R(x);
    return '<li>'+(typeof v==='function'?v(args[i]):v)+'</li>';}).join('');
  g('findList').innerHTML=T[LANG].find.map(x=>'<li>'+R(x)+'</li>').join('');
  g('applyList').innerHTML=T[LANG].apply.map(x=>
    `<li><span class="tag">${LANG==='ko'?'모듈 '+x.tag:'Module '+x.tag}</span><span class="body">${R(x)}</span></li>`).join('');
}

function applyStatic(){
  document.documentElement.lang=LANG;
  document.title=K('docTitle');
  const md=g('metaDesc');if(md)md.setAttribute('content',K('metaDesc'));
  document.body.className=(LANG==='ko'?'ko':'');
  document.querySelectorAll('[data-i]').forEach(n=>{
    const v=K(n.getAttribute('data-i'));
    if(typeof v==='string'){ if(/<[a-z]/i.test(v))n.innerHTML=v; else n.textContent=v; }});
  document.querySelectorAll('[data-i-label]').forEach(n=>{
    const v=K(n.getAttribute('data-i-label'));
    if(typeof v==='string')n.setAttribute('aria-label',v);});
  document.querySelectorAll('button[data-lang]').forEach(b=>
    b.setAttribute('aria-pressed',String(b.getAttribute('data-lang')===LANG)));
  document.querySelectorAll('button[data-lvl]').forEach(b=>
    b.setAttribute('aria-pressed',String(b.getAttribute('data-lvl')===LVL)));
}

function renderAll(){
  applyStatic();
  heroText();heroDraw();drawA();drawB();
  const r=drawC();
  drawD();
  drawTail(r.naive,r.infl,r.cv);
}

function syncUrl(){
  if(!history.replaceState)return;
  const u=new URL(location.href);
  u.searchParams.set('lang',LANG);u.searchParams.set('level',LVL);
  history.replaceState(null,'',u);
}
function relabelWindows(){
  [...g('winSel').options].forEach(o=>
    o.textContent=o.value+(LANG==='ko'?'일':(' day'+(+o.value>1?'s':''))));
}

function boot(){
  const ws=[...new Set(M.b.rule_totals_by_window.map(r=>r.window_days))].sort((a,b)=>a-b);
  ws.forEach(w=>{const o=document.createElement('option');o.value=w;
    if(w===30)o.selected=true;g('winSel').appendChild(o);});
  const mcs=[...new Set(M.b.rank_agreement.map(r=>r.min_credit))].sort((a,b)=>a-b);
  mcs.forEach(m=>{const o=document.createElement('option');o.value=m;
    o.textContent=String(m);if(m===200)o.selected=true;g('mcSel').appendChild(o);});
  relabelWindows();

  document.querySelectorAll('input[name=hero]').forEach(r=>
    r.addEventListener('change',e=>{heroMode=e.target.value;heroDraw();}));
  g('winSel').addEventListener('change',drawRules);
  g('mcSel').addEventListener('change',drawRank);
  g('liftR').addEventListener('input',liftCalc);
  g('liftSnap').addEventListener('click',()=>{
    const cv=M.c.itt.find(r=>r.outcome==='conversions');
    g('liftR').value=Math.round(cv.rel_lift*100);liftCalc();});
  ['baseN','mdeR','dailyN','rollR'].forEach(i=>{
    const n=g(i);if(n)n.addEventListener('input',ssCalc);});
  const ps=g('preSel');
  if(ps)ps.addEventListener('change',()=>{g('baseN').value=ps.value;ssCalc();});
  document.querySelectorAll('button[data-lang]').forEach(b=>
    b.addEventListener('click',()=>{LANG=b.getAttribute('data-lang');
      syncUrl();relabelWindows();renderAll();}));
  document.querySelectorAll('button[data-lvl]').forEach(b=>
    b.addEventListener('click',()=>{LVL=b.getAttribute('data-lvl');
      syncUrl();renderAll();}));
  renderAll();
}

load().then(boot).catch(e=>{
  applyStatic();
  console.error(e);
  g('err').style.display='block';
  g('errDetail').textContent=K('errDetail')(e.message,location.protocol);
});
</script>
</body>
</html>
